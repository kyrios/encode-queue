openapi: 3.1.0
info:
  title: encode-queue helper API
  version: 1.10.0
  license: { name: MIT, identifier: MIT }
  summary: How a worker takes jobs from the queue through its WireGuard tunnel.
  description: |
    The worker side of [ADR-0007](https://github.com/iPhoneblog-web/iphoneblog-wordpress/blob/main/docs/adr/0007-encode-helpers.md)
    (iphoneblog-wordpress). The queue server (`encode-queue`) serves it **only inside its own
    WireGuard tunnel**; the pipeline and the upload center use the other API,
    [pipeline-admin.yaml](pipeline-admin.yaml), on the queue's Docker network.

    **Every worker is a helper**, `encoder`'s own included (ADR-0007 §1). A worker is known by
    its tunnel address, which WireGuard ties to its key; there is no token and no TLS inside the
    tunnel. The queue brings its WireGuard itself (wireguard-go in userspace, its own network
    stack), so the address, the port and the endpoint are the queue's configuration, never part
    of this API: the worker learns the API's base URL from the `api` field of its tunnel
    configuration (see `TunnelConfig` in pipeline-admin.yaml).

    **Not in this API: ProRes.** A ProRes file dropped into the upload center is encoded on the
    Mac and uploaded by the page (ADR-0007 §7). It is not a queue job.

    **Resources**

    | resource | what it is |
    |---|---|
    | `/me` | the calling worker: its name, limits and pause |
    | `/me/capabilities` | what it runs: tools, models, fonts, hardware |
    | `/me/presence` | that it is alive, and in which state |
    | `/jobs/{id}/source`, `/jobs/{id}/inputs/{name}` | the files a job is made from |
    | `/leases` | the jobs a worker holds. Creating one is claiming a job |
    | `/leases/{id}/logs` | the tool's log lines while it works |
    | `/leases/{id}/result` | what the worker made, and the verdict on it |
    | `/files` | resumable uploads (tus 1.0) that a result points to |

    **Rules every call follows**

    - **Pull only.** The worker asks; the queue never calls a worker.
    - **HTTP means what it says.** `201` with `Location` for anything created, `204` for nothing
      to return, `409` for a state that forbids the call, `410` for a lease that is gone
      (expired, cancelled, done elsewhere, or preempted for a job of higher priority): the
      worker stops that job at once and deletes its files.
    - **Long poll with `Prefer: wait=N`** (RFC 7240), at most 25 s. The answer names what it
      applied in `Preference-Applied`.
    - **Partial updates are JSON Merge Patch** (RFC 7396, `application/merge-patch+json`).
    - **Errors** are `application/problem+json` (RFC 9457) with a stable `code`. A worker acts
      on `code`, never on the text.
    - **`503` with code `draining`** and `Retry-After`: the queue hands out no new work for now
      (it is shutting down).
    - **Times** are UTC, RFC 3339. **Sizes** are bytes. **Durations** are seconds unless the
      field ends in `_ms`.
    - **The timings** (ADR-0007 §3): a lease lasts 120 s and is renewed every 30 s; the long
      poll waits 25 s; presence every 30 s, offline after three missed; a pause gives its job
      back after 60 s. The queue sends the values it uses (`renew_every_s`,
      `presence_every_s`, `pause_give_back_s`); the worker uses those, not its own.
    - **Attempts.** Every lease is one attempt at its job and has a number. A result that
      arrives after its lease was taken back is still taken and judged: the first result the
      pipeline accepts wins, every later one is `superseded`. A late result never overwrites a
      newer one.
    - **Exact tool versions.** The queue offers a job only to a worker whose tools match the
      job's `requires` exactly, as text (see `Tool`).
    - **Pause.** A paused worker creates no lease. It either suspends its encode and keeps
      renewing its lease with `phase: paused`, or lets the running job finish and renews it as
      usual (v0.2.18, 1.9.0). A suspended lease with `pause_hold` (archive and stage 2) stays
      through the pause, its hold time stopped while it is suspended, up to 24 h; the tool goes
      on where it stood. Any other suspended lease the worker deletes after `pause_give_back_s`
      with `reason=paused`; if it does not, the queue takes it back itself 30 s later. The queue
      never takes back a lease whose phase is not `paused`. A pause can come from the worker
      (`PATCH /me`) or from the upload center; the worker reads the current one from every
      presence and lease answer.
    - **Low priority.** The worker runs every tool at `nice 19`.
servers:
  - url: '{api}'
    description: The queue inside the worker's tunnel. The base URL is the `api` field of the tunnel configuration.
    variables:
      api:
        default: http://queue.invalid/v1
        description: The tunnel configuration's `api` (the queue's tunnel address and API port, both queue configuration).
tags:
  - name: Me
    description: The calling worker, what it runs, its limits, its pause, its presence.
  - name: Sources
    description: The files a job is made from, for the worker that holds its lease.
  - name: Leases
    description: Holding a job, reporting progress and log lines, giving it back, delivering the result.
  - name: Files
    description: Resumable uploads (tus 1.0) for results.
security: []

paths:
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The calling worker
      responses:
        '200':
          description: This worker as the queue knows it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '403': { $ref: '#/components/responses/UnknownPeer' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Change this worker's limits or pause
      description: |
        The menu bar's pause is `{"paused_until": "..."}` (30 minutes, 2 hours or 24 hours from
        now); "Resume" is `{"paused_until": null}`. The settings change `limits`. The queue
        shows both in the upload center.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/MePatch' }
      responses:
        '200':
          description: This worker after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '403': { $ref: '#/components/responses/UnknownPeer' }
        '422': { $ref: '#/components/responses/Invalid' }

  /me/capabilities:
    get:
      tags: [Me]
      operationId: getCapabilities
      summary: What this worker last said it runs, and what that allows
      responses:
        '200':
          description: The capabilities and the verdict on them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityReport' }
        '403': { $ref: '#/components/responses/UnknownPeer' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Me]
      operationId: putCapabilities
      summary: Say what this worker runs
      description: |
        On every start, and whenever a tool, a model or the app changes. The queue answers with
        the job kinds this worker may take against the reference tools (the tools of the
        queue's reference worker, `encoder`'s own); a kind whose versions differ is listed
        under `refused` with the reason. A worker below `min_app_version` gets `426` and may
        take nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Capabilities' }
      responses:
        '200':
          description: Stored, with the verdict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilityReport' }
        '403': { $ref: '#/components/responses/UnknownPeer' }
        '422': { $ref: '#/components/responses/Invalid' }
        '426': { $ref: '#/components/responses/AppTooOld' }

  /me/presence:
    put:
      tags: [Me]
      operationId: putPresence
      summary: Say this worker is alive, and in which state
      description: |
        Every `presence_every_s` (from the answer), busy, idle or paused. A worker that misses
        three is `offline`, and its leases go back to the queue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Presence' }
      responses:
        '200':
          description: Noted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresenceAck' }
        '403': { $ref: '#/components/responses/UnknownPeer' }

  /jobs/{job_id}/source:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Sources]
      operationId: getJobSource
      summary: The file the job is made from
      description: |
        Only for the worker that holds an active lease on the job. Resumes with `Range`. The
        worker checks the file's sha256 (`ETag`, and `source.sha256` in the lease) before it
        starts.
      parameters:
        - name: Range
          in: header
          schema: { type: string, examples: ['bytes=1048576-'] }
      responses:
        '200':
          description: The whole file.
          headers:
            ETag: { description: 'The file''s sha256, quoted.', schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '206':
          description: The requested part.
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '403': { $ref: '#/components/responses/NotYourLease' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{job_id}/inputs/{name}:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9_-]{1,32}$', examples: [captions] }
    get:
      tags: [Sources]
      operationId: getJobInput
      summary: Another file the job needs, by its name in `job.inputs`
      description: For example the burnt-in captions (an ASS file) of a #one preview's Mastodon version. Same rules as the source.
      parameters:
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: The whole file.
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '206':
          description: The requested part.
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '403': { $ref: '#/components/responses/NotYourLease' }
        '404': { $ref: '#/components/responses/NotFound' }

  /leases:
    get:
      tags: [Leases]
      operationId: listLeases
      summary: The leases this worker holds
      description: After a restart, the worker reads these and gives back each one it cannot resume (x265 cannot resume, so in practice every one).
      responses:
        '200':
          description: This worker's active leases.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Lease' } }
        '403': { $ref: '#/components/responses/UnknownPeer' }
    post:
      tags: [Leases]
      operationId: createLease
      summary: Claim a job (long poll)
      description: |
        Creates a lease on the next job this worker may run, waiting up to `Prefer: wait`
        seconds for one. `201` with the lease, or `204` when none came; the worker asks again at
        once. A paused worker gets `409 paused`, one whose slots of the claim's kind (`slot`) are all
        taken `409 limit_reached`, one that never sent its capabilities `409 no_capabilities`, an
        unknown `slot` `422 invalid`. The queue leases only while its disk has room for the result;
        until then it answers `204`.
      parameters:
        - name: Prefer
          in: header
          schema: { type: string, examples: ['wait=25'] }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaseRequest' }
      responses:
        '201':
          description: A job, leased to this worker.
          headers:
            Location: { schema: { type: string, examples: ['/v1/leases/ls_01JB2Q8V3M6N7P8R9S0T1V2W3X'] } }
            Preference-Applied: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lease' }
        '204':
          description: No job for this worker now.
          headers:
            Preference-Applied: { schema: { type: string } }
        '403': { $ref: '#/components/responses/UnknownPeer' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Draining' }

  /leases/{lease_id}:
    parameters:
      - $ref: '#/components/parameters/LeaseId'
    get:
      tags: [Leases]
      operationId: getLease
      summary: One lease
      responses:
        '200':
          description: The lease.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lease' }
        '403': { $ref: '#/components/responses/NotYourLease' }
        '410': { $ref: '#/components/responses/LeaseGone' }
    patch:
      tags: [Leases]
      operationId: updateLease
      summary: Report progress, which renews the lease
      description: |
        Every `renew_every_s` while the worker holds the lease, paused or not: phase, share
        done, frames per second, speed, time left. The answer carries the new `expires_at` and
        the worker's current `paused_until`. A lease that was cancelled, done elsewhere,
        preempted or that expired answers `410`; the worker stops.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              required: [progress]
              properties:
                progress: { $ref: '#/components/schemas/Progress' }
      responses:
        '200':
          description: The lease, renewed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lease' }
        '403': { $ref: '#/components/responses/NotYourLease' }
        '410': { $ref: '#/components/responses/LeaseGone' }
    delete:
      tags: [Leases]
      operationId: deleteLease
      summary: Give the job back
      description: |
        The job goes back to `queued` at once, for the next worker; it is not counted as a
        failure. `reason=paused` is the 60-second rule of the pause, `quit` a worker that stops.
      parameters:
        - name: reason
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ReleaseReason' }
      responses:
        '204': { description: Given back. }
        '403': { $ref: '#/components/responses/NotYourLease' }
        '410': { $ref: '#/components/responses/LeaseGone' }

  /leases/{lease_id}/logs:
    parameters:
      - $ref: '#/components/parameters/LeaseId'
    post:
      tags: [Leases]
      operationId: appendLeaseLogs
      summary: Add log lines
      description: |
        The tool's output and the worker's own lines, in batches: at most every 5 s, at most 500
        lines or 256 KiB a batch. Lines are text for people; the worker never reports state
        through them. The queue keeps the last 2,000 lines of each lease; the upload center
        reads them through pipeline-admin.yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items: { $ref: '#/components/schemas/LogLineIn' }
      responses:
        '202': { description: Stored. }
        '403': { $ref: '#/components/responses/NotYourLease' }
        '410': { $ref: '#/components/responses/LeaseGone' }
        '413': { $ref: '#/components/responses/TooLarge' }

  /leases/{lease_id}/result:
    parameters:
      - $ref: '#/components/parameters/LeaseId'
    put:
      tags: [Leases]
      operationId: putResult
      summary: Deliver what the worker made, or that it failed
      description: |
        Ends the lease. A file result points to a finished upload in `/files` and carries the
        file's sha256, which the queue checks against what arrived. A failure carries its code
        and one line for a person. The queue takes a result also for a lease that ran out or was
        preempted, as long as the job is not done (the late result of ADR-0007 §3); it answers
        `410 job_done` once another attempt was accepted. The pipeline judges every file result
        against ADR-0005's floors (`GET` the result for the verdict). A failure puts the job
        back to `queued` and offers it to this worker no more.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultIn' }
      responses:
        '202':
          description: Taken; the verdict follows.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '403': { $ref: '#/components/responses/NotYourLease' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/LeaseGone' }
        '422': { $ref: '#/components/responses/Invalid' }
    get:
      tags: [Leases]
      operationId: getResult
      summary: The result and the verdict on it
      description: Works after the lease ended, so the worker can show "accepted" or "rejected" and why.
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Result' }
        '403': { $ref: '#/components/responses/NotYourLease' }
        '404': { $ref: '#/components/responses/NotFound' }

  /files:
    post:
      tags: [Files]
      operationId: createFile
      summary: Start a resumable upload (tus creation)
      description: |
        For a lease's result. `Upload-Metadata` names the lease (`lease_id`, base64 as tus
        requires); the upload may not exceed the lease's `result.max_bytes`. **It must fit the
        queue's disk** (v0.2.20): free space less the reserve, what other uploads still have to
        write, and the `max_bytes` of the active high-priority leases that have not begun theirs.
        Otherwise `503 no_room` with `Retry-After`; the lease stays, and the worker asks again.
      parameters:
        - $ref: '#/components/parameters/TusResumable'
        - name: Upload-Length
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
        - name: Upload-Metadata
          in: header
          required: true
          schema: { type: string, examples: ['lease_id bHNfMDFKQi4uLg=='] }
      responses:
        '201':
          description: Created.
          headers:
            Location: { schema: { type: string, examples: ['/v1/files/f_7hq2k9m3x8c4v1b6'] } }
            Tus-Resumable: { schema: { type: string, const: 1.0.0 } }
        '403': { $ref: '#/components/responses/NotYourLease' }
        '410': { $ref: '#/components/responses/LeaseGone' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '503':
          description: '`no_room`: no room on the queue''s disk for the result yet; ask again after `Retry-After`.'
          headers:
            Retry-After: { schema: { type: integer, const: 30 } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /files/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, pattern: '^f_[a-z0-9]{16}$' }
    head:
      tags: [Files]
      operationId: getFileOffset
      summary: How much has arrived
      parameters:
        - $ref: '#/components/parameters/TusResumable'
      responses:
        '200':
          description: The offset to resume from.
          headers:
            Upload-Offset: { schema: { type: integer } }
            Upload-Length: { schema: { type: integer } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Files]
      operationId: appendFile
      summary: Send the next chunk
      parameters:
        - $ref: '#/components/parameters/TusResumable'
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, contentMediaType: application/octet-stream }
      responses:
        '204':
          description: Chunk stored.
          headers:
            Upload-Offset: { schema: { type: integer } }
        '403': { $ref: '#/components/responses/NotYourLease' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: Drop an unfinished upload (tus termination)
      parameters:
        - $ref: '#/components/parameters/TusResumable'
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/JobId' }
    LeaseId:
      name: lease_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/LeaseId' }
    TusResumable:
      name: Tus-Resumable
      in: header
      required: true
      schema: { type: string, const: 1.0.0 }

  responses:
    UnknownPeer:
      description: The tunnel address belongs to no worker (`unknown_peer`), or the worker was removed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotYourLease:
      description: This lease, job or file belongs to another worker, or to no active lease of this one (`not_your_lease`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such job, lease, file or result (`not_found`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LeaseGone:
      description: |
        The lease ended without this worker (`lease_expired`, `lease_cancelled`, `job_done`,
        `preempted`, `overdue`). `overdue` (1.4.0): held past its `hold_until`; the job goes back
        and this worker gets it no more. Stop the job and delete its files. `preempted`: a job of higher priority
        found no free worker, and this lease had the lowest priority; the job goes back to the
        queue.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The state forbids this (`paused`, `limit_reached`, `no_capabilities`, `offset_mismatch`, `result_exists`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Invalid:
      description: The body breaks the schema or a rule (`invalid`, `checksum_mismatch`, `upload_incomplete`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooLarge:
      description: Larger than allowed (`too_large`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AppTooOld:
      description: The worker is below `min_app_version` (`app_too_old`). It shows "please update".
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Draining:
      description: The queue hands out no new work for now (`draining`). Ask again after `Retry-After`.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [unknown_peer, not_your_lease, not_found, lease_expired, lease_cancelled, job_done, preempted, overdue,
                 paused, limit_reached, no_capabilities, offset_mismatch, result_exists, invalid,
                 checksum_mismatch, upload_incomplete, too_large, app_too_old, draining]

    WorkerId:
      type: string
      pattern: '^wk_[a-z0-9]{8}$'
      examples: ['wk_7k2m9q4d']
    JobId:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{0,63}\.[a-z0-9-]{1,32}$'
      description: The upload's id and what the job makes; chosen by the pipeline.
      examples: ['one_528.2160-stage2', 'one_528.whisper']
    LeaseId:
      type: string
      pattern: '^ls_[0-9A-Z]{26}$'

    Limits:
      type: object
      description: How much of the machine the worker may use for queue jobs. Every tool runs at `nice 19` regardless.
      properties:
        cpu_threads: { type: [integer, 'null'], minimum: 1, description: "x265's thread pool (`pools=N`) and whisper.cpp's threads; from v0.2.17 also the cores a running tool may use, and from v0.2.18 a lower one lengthens the holds of the worker's leases (1.9.0). Null: the tool's own default." }
        gpu: { type: boolean, description: whisper.cpp may use the GPU (Metal on a Mac). }
        max_parallel_jobs: { type: integer, minimum: 1, default: 1, description: 'Normal slots, which take every job. What the worker asks for; the queue gives at most EQ_MAX_PARALLEL_JOBS (2) (1.4.0).' }
        high_priority_slots:
          type: integer
          minimum: 0
          description: |
            High-priority slots on top of the normal ones (v0.2.14, 1.6.0), which take only jobs of
            priority `now` and `stage1`, so no archive or stage 2 job ever holds one. What the worker
            asks for; the queue gives at most EQ_MAX_HIGH_PRIORITY_SLOTS (2). A worker that does not
            send it (before 0.2.14) has one, its extra slot (v0.2.5). The worker's default is 1.
        efficiency:
          type: string
          enum: [all, archive]
          description: |
            Which jobs run on the efficiency cores only, in macOS's background QoS (v0.2.18,
            1.9.0): `all`, or `archive` (jobs of priority archive). Absent: none. The ECT divides
            such a job's run time by `efficiency_speed`, and its lease's hold grows with it.
        efficiency_speed: { type: number, exclusiveMinimum: 0, maximum: 1, description: "The share of the machine's full speed a job gets on the efficiency cores, the worker's estimate (v0.2.18, 1.9.0)." }
    Me:
      type: object
      required: [worker_id, name, state]
      properties:
        worker_id: { $ref: '#/components/schemas/WorkerId' }
        name: { type: string, examples: ['Mac Studio Thorsten'] }
        owner: { type: string, examples: [kyrios] }
        state: { type: string, enum: [idle, working, paused, offline] }
        paused_until: { type: [string, 'null'], format: date-time }
        limits: { $ref: '#/components/schemas/Limits' }
        tunnel_address: { type: string, examples: ['10.10.20.11'] }
        app_version: { type: [string, 'null'] }
        last_seen: { type: [string, 'null'], format: date-time }
        leases: { type: array, items: { $ref: '#/components/schemas/LeaseId' }, description: Its active lease ids. }
        counts: { $ref: '#/components/schemas/WorkerCounts' }
    WorkerCounts:
      type: object
      description: Every attempt this worker ended, by how it ended.
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        superseded: { type: integer }
        failed: { type: integer }
        given_back: { type: integer }
        expired: { type: integer }
        preempted: { type: integer }
        cancelled: { type: integer }
    MePatch:
      type: object
      properties:
        paused_until:
          type: [string, 'null']
          format: date-time
          description: 30 minutes, 2 hours or 24 hours from now, from the menu; null resumes.
        limits: { $ref: '#/components/schemas/Limits' }

    Tool:
      type: object
      required: [name, version]
      description: |
        A tool and its version string, compared as text. Each worker reads them the same way
        (`encode-worker versions` prints them):

        - `ffmpeg`: the word after `ffmpeg version ` in the first line of `ffmpeg -version`
          (for example `7.1.2-0+deb13u1`).
        - `libx265`: from a one-frame encode through that ffmpeg, the text between `x265 (build
          N) - ` and the next `:` in the stream's SEI (for example `4.1+1-1d117be`).
        - `libx264`: the same with libx264, `core N rNNNN hash` from its SEI (for example
          `core 164 r3108 31e19f9`).
        - `whisper.cpp`: the release tag the binary was built from (for example `v1.9.5`).
        - `mlx-qwen3-asr` or `qwen-asr` (v0.2.16): the aligner's engine and its package's version,
          as `align.py version` prints it under the aligner's Python (for example `0.4.4` on a
          Mac, `0.0.6` in the Linux image). A worker has at most the best one.
      properties:
        name: { type: string, enum: [ffmpeg, libx265, libx264, whisper.cpp, mlx-qwen3-asr, qwen-asr] }
        version: { type: string, examples: ['7.1.2-0+deb13u1', '4.1+1-1d117be', 'core 164 r3108 31e19f9', 'v1.9.5'] }
    Model:
      type: object
      required: [name, sha256]
      properties:
        name: { type: string, examples: ['ggml-medium.bin'] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    Capabilities:
      type: object
      required: [app_version, os, tools]
      properties:
        app_version: { type: string, description: 'The worker''s own version (encode-worker''s release, e.g. `0.1.0`)., examples: [''0.1.0'']' }
        os: { type: string, examples: ['macOS 26.1', 'Debian 13 (linux/amd64)'] }
        host_app:
          type: object
          required: [name, version]
          description: |
            The app the worker runs inside, if any (Slipstream on a Mac). Shown on the Encoder
            page; never compared with `min_app_version`, which applies to `app_version` only.
            The worker sends it when it is started with `EQ_HOST_APP_NAME` and
            `EQ_HOST_APP_VERSION` (or `--host-app-name`, `--host-app-version`).
          properties:
            name: { type: string, maxLength: 64, examples: [Slipstream] }
            version: { type: string, maxLength: 64, examples: ['1.0.3'] }
        tools: { type: array, items: { $ref: '#/components/schemas/Tool' } }
        models: { type: array, items: { $ref: '#/components/schemas/Model' } }
        fonts: { type: array, items: { type: string }, description: 'Font families libass can use (fontconfig names)., examples: [[''Inter ExtraBold'']]' }
        hardware:
          type: object
          properties:
            chip: { type: string, examples: ['Apple M2 Max'] }
            cpus: { type: integer }
            performance_cores: { type: integer }
            efficiency_cores: { type: integer }
            gpu_cores: { type: integer }
            memory_bytes: { type: integer, description: 'The RAM the worker may use: the machine''s, or on Linux its cgroup''s limit where that is lower (v0.2.15: a container with `mem_limit`).' }
            cpu_cores: { type: integer, description: Physical cores. }
            cpu_threads: { type: integer, description: Logical CPUs the worker can use. }
            os_name: { type: string, examples: [macOS, 'Debian GNU/Linux'] }
            os_version: { type: string, examples: ['15.6', '13'] }
            arch: { type: string, examples: [arm64, amd64] }
            kernel: { type: string, description: 'The kernel release (`uname -r`); in a container, the host''s.', examples: ['6.12.48+deb13-amd64', '24.6.0'] }
        calibration:
          type: object
          description: |
            The worker's fps on the calibration clip (v0.2.5): 10 s of 4K test pattern with grain
            that it makes with its own ffmpeg, bit-exact, then encodes once per rung class with
            the rung's real flags. It runs at pairing and again when ffmpeg, libx265 or libx264
            change (`EQ_CALIBRATE=false` turns it off). The queue compares only calibrations of
            the same clip and drops one made with tools the worker no longer reports.
          required: [clip_sha256, tools, at, classes]
          properties:
            clip_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            tools: { type: array, items: { $ref: '#/components/schemas/Tool' }, description: 'ffmpeg, libx264 and libx265 as they were.' }
            at: { type: string, format: date-time }
            classes:
              type: array
              maxItems: 32
              items:
                type: object
                required: [class, frames, fps]
                properties:
                  class: { type: string, examples: ['libx265 3840x2160 slower'] }
                  frames: { type: integer, description: 'How many of the clip''s frames it encoded.' }
                  fps: { type: number, exclusiveMinimum: 0 }
            whisper:
              type: array
              maxItems: 16
              description: |
                v0.2.7: every model the worker holds, timed on the same 21.6 s of German speech (in
                the worker binary) with a job's thread count and GPU setting. A model first runs
                on the first 5 s; below 0.25 times real time there it stops at that probe.
              items:
                type: object
                required: [sha256, name, whisper, gpu, threads, audio_s, speed]
                properties:
                  sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                  name: { type: string, examples: [ggml-large-v3-turbo.bin] }
                  whisper: { type: string, description: whisper.cpp's version it ran with; the queue drops an entry of another. }
                  gpu: { type: boolean }
                  threads: { type: integer }
                  audio_s: { type: number }
                  speed: { type: number, exclusiveMinimum: 0, description: 'Seconds of audio per second; 1 is real time.' }
                  probe: { type: boolean }
    CapabilityReport:
      type: object
      required: [capabilities, accepted, min_app_version]
      properties:
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        accepted: { type: array, items: { $ref: '#/components/schemas/JobKind' } }
        refused:
          type: array
          items:
            type: object
            required: [kind, reason]
            properties:
              kind: { $ref: '#/components/schemas/JobKind' }
              reason: { type: string, examples: ['libx265 differs: worker 4.0, reference 4.1+1-1d117be'] }
              reference: { type: array, items: { $ref: '#/components/schemas/Tool' } }
        min_app_version: { type: string }
        wanted_models:
          type: array
          description: |
            The whisper models the queue wants this worker to hold (v0.2.7): small for caption
            timing, and large-v3-turbo, the one caption model on every worker (v0.2.14), whenever
            its peak fits the worker's RAM with 1 GB to spare. The worker fetches each it lacks from
            `url` (ggerganov/whisper.cpp at a pinned revision, nothing else), checks `sha256`,
            times it and sends its capabilities again.
          items:
            type: object
            required: [name, sha256, bytes, url]
            properties:
              name: { type: string, examples: [ggml-large-v3-turbo.bin] }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              bytes: { type: integer, examples: [1624555275] }
              url: { type: string, examples: ['https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-large-v3-turbo.bin'] }
    Presence:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [idle, working, paused] }
        disk_free_bytes: { type: integer }
        on_battery: { type: boolean }
        memory_used_bytes: { type: integer, description: 'RAM in use: macOS active, wired and compressed pages; Linux MemTotal less MemAvailable, or, under a cgroup limit lower than the machine (v0.2.15), the cgroup''s use less its inactive page cache.' }
        other_load: { type: number, minimum: 0, description: 'Threads other programs keep busy (v0.2.7): the machine''s busy threads (Linux /proc/stat, macOS ps -A) less `threads_busy`. The queue counts the machine as that much slower for the next job. Left out when unknown.' }
        threads_busy: { type: integer, minimum: 0, description: 'How many threads the worker''s own tools kept busy since the last presence (v0.2.5): Linux from their process groups'' CPU time, macOS from ps''s %cpu. Left out when unknown.' }
    PresenceAck:
      type: object
      required: [server_time, presence_every_s, paused_until]
      properties:
        server_time: { type: string, format: date-time }
        presence_every_s: { type: integer, examples: [30] }
        paused_until: { type: [string, 'null'], format: date-time, description: 'The pause the queue holds for this worker, the upload center''s included.' }
        draining: { type: boolean }
        points:
          type: object
          description: |
            This worker's points (v0.2.15, 1.7.0; README, "Points"): what its accepted results
            earned by Punkte-Tabelle v1, one point a minute of the Mac Studio's work, `today` and
            `week` (from Monday) in Europe/Berlin, and `total`; and its place today among every
            paired worker, `rank` of `of`, equal points sharing a place. The queue computes them;
            the worker only shows them (Slipstream's menu).
          required: [table, today, week, total, rank, of]
          properties:
            table: { type: string, examples: [v1] }
            today: { type: number, minimum: 0 }
            week: { type: number, minimum: 0 }
            total: { type: number, minimum: 0 }
            rank: { type: integer, minimum: 1 }
            of: { type: integer, minimum: 1 }

    JobKind:
      type: string
      enum: [rung, whisper, cut, remux, check, align]
      description: |
        `align` from v0.2.16 (`AlignParams`): Qwen3-ForcedAligner times a text's words; a worker
        before 0.2.16 never gets one.
        `cut`, `remux` and `check` from v0.2.8 (ADR-0007: every encode and every decode runs on a
        worker; the pipeline reads headers only). `rung`, `cut` and `remux` check their own result
        in the same lease (`CheckSettings`) and deliver the figures with it; `check` only checks,
        for a file no worker encoded.
    Priority:
      type: string
      enum: [now, stage1, stage2, archive]
      description: '`now` (v0.2.5; Funkhaus shows it as "Sofort") for a job someone waits for, then ADR-0005''s order. Stage 1 of a new upload first.'
    RungParams:
      type: object
      title: rung
      description: |
        Structured, never a command line: the worker builds the ffmpeg arguments itself, in the
        order `video-encode` did, so the queue cannot make a worker run anything else and a
        worker's file is the file `encoder` would have made.

        For `libx265`: `-i SRC -map 0:v:0 [-map 0:a:0] -fps_mode passthrough
        [-vf [crop=…,][fps=F,]scale=W:H:flags=lanczos] -c:v libx265 -preset P -crf C -pix_fmt yuv420p10le
        -profile:v main10 -tag:v hvc1 -x265-params log-level=error[:vbv-maxrate=R:vbv-bufsize=B][:pools=N]`.
        For `libx264`: `-vf [crop=…,][fps=F,][scale=…,]format=yuv420p[,ass=filename=…]
        -c:v libx264 -preset P -crf C [-maxrate Rk -bufsize Bk] -profile:v high -pix_fmt yuv420p`.
        Then the audio (`-c:a copy`, or `[-af pan=…] -c:a aac -b:a Bk [-ar S] [-ac C]`), then
        `-map_metadata -1 -map_chapters -1 [-use_editlist 0] -movflags +faststart OUT`.

        **A clip's settings** (v0.2.13; video-pipeline v0.2.10's Short for Instagram Reels, YouTube
        Shorts, Mastodon, Threads and Bluesky): `fps`, `audio.sample_rate`, `audio.channels` and
        `edit_list: false`. A worker before 0.2.13 would drop them and make the file without them,
        so a rung with any of them goes only to a worker of 0.2.13 or later.
      required: [codec, preset, crf, width, height]
      properties:
        rung: { type: string, examples: ['2160', '1080', '720', h264, mastodon], description: 'The rung''s name, for people.' }
        codec: { type: string, enum: [libx265, libx264] }
        preset: { type: string, enum: [ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow] }
        crf: { type: number }
        width: { type: integer, description: The output's width; the worker scales when it differs from the source's (after the crop). }
        height: { type: integer }
        crop:
          type: [object, 'null']
          required: [width, height, x, y]
          properties:
            width: { type: integer }
            height: { type: integer }
            x: { type: integer }
            y: { type: integer }
        vbv_maxrate_kbps: { type: [integer, 'null'] }
        vbv_bufsize_kbit: { type: [integer, 'null'] }
        audio:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [copy, aac, none], description: '`none` when the source has no sound.' }
            bitrate_kbps: { type: integer, description: For `aac`. }
            mono:
              oneOf: [{ type: boolean }, { type: string, const: measure }]
              default: false
              description: |
                Downmix two channels that carry one signal: `-af pan=mono|c0=0.5*c0+0.5*c1`.
                `measure` (v0.2.8), for a source with two channels: the worker measures first
                (`-map 0:a:0 -af pan=stereo|c0=0.5*c0+0.5*c1|c1=0.5*c0-0.5*c1,astats=measure_perchannel=RMS_level:measure_overall=none
                -f null -`, channel 1 the mid, 2 the side) and downmixes when the side is silent or
                at least `mono_side_below_db` below the mid. A level it cannot read counts as
                stereo. `CheckFigures.audio_levels` says what it found.
            mono_side_below_db: { type: number, default: 40 }
            sample_rate:
              type: integer
              enum: [8000, 11025, 12000, 16000, 22050, 24000, 32000, 44100, 48000, 64000, 88200, 96000]
              description: 'For `aac` (v0.2.13): `-ar S`. Absent, the source''s rate.'
            channels:
              type: integer
              minimum: 1
              maximum: 8
              description: 'For `aac` (v0.2.13): `-ac C`. Absent, the source''s channels. Not beside `mono` true or `measure`, which set the channels themselves.'
        check: { $ref: '#/components/schemas/CheckSettings' }
        fps:
          oneOf:
            - { type: number, minimum: 1, maximum: 240 }
            - { type: string, pattern: '^[0-9]{1,6}/[0-9]{1,6}$' }
          examples: [60, '30000/1001']
          description: |
            The frame rate the file goes out at (v0.2.13): `fps=F` in the filter chain, after the
            crop and before the scale, so a 120 fps source drops half its frames before the scale
            works on them; the captions come after it, drawn at the output frames' own times. A
            number (`60`, `29.97`, at most three decimals) or a ratio (`"30000/1001"`), 1 to 240.
            Absent, the file keeps the source's rate (`-fps_mode passthrough`). At another rate the
            file has its own frames: the check reports `frames` and no `source_frames`, and its
            `compare` takes the source through the same `fps=F` first, so each pair is one moment.
        edit_list:
          type: boolean
          default: true
          description: |
            `false` (v0.2.13): an MP4 without edit lists, `-use_editlist 0`, as Instagram's and
            Threads' specs ask. The mov muxer then shifts both tracks so the first timestamp is 0
            and stretches the first sample of the track that starts earlier: with B-frames, the AAC
            priming's packet lasts until the picture starts. By the timestamps (ffmpeg) picture and
            sound stay together to the sample; AVFoundation plays the sound earlier by the
            picture's delay less the priming, 58.7 ms at 25 fps and 22.7 ms at 60 (measured,
            encode-queue#20). `true` or absent: ffmpeg's own edit lists.
        captions:
          type: [object, 'null']
          description: Captions burnt in by libass (libx264 only). The ASS file is the job input `input`; the worker must have `font`.
          required: [input, font]
          properties:
            input: { type: string, examples: [captions] }
            font: { type: string, examples: ['Inter ExtraBold'] }
    CutParams:
      type: object
      title: cut
      description: |
        A stretch of the source as its own file, frame-exact from `start_s` (v0.2.8; a #one
        preview from its Folge): `-ss START -i SRC -t LENGTH -map 0:v:0 [-map 0:a:0]
        -vf [fade=t=out:st=LENGTH-FADE:d=FADE:color=black,]format=yuv420p|yuv420p10le
        -c:v libx264 -preset P -crf C -profile:v high|high10 [-color_primaries …
        -color_trc … -colorspace …] [-af afade=t=out:st=…:d=FADE] [-c:a aac -b:a Rk]
        -map_metadata -1 -map_chapters -1 -movflags +faststart OUT`.
      required: [start_s, length_s, preset, crf, bit_depth]
      properties:
        start_s: { type: number, minimum: 0 }
        length_s: { type: number, exclusiveMinimum: 0 }
        fade_s: { type: number, minimum: 0, default: 0 }
        preset: { type: string, enum: [ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow] }
        crf: { type: number }
        bit_depth: { type: integer, enum: [8, 10] }
        colour:
          type: object
          properties:
            primaries: { type: string, pattern: '^[a-z0-9_-]{1,32}$', examples: [bt709] }
            transfer: { type: string, pattern: '^[a-z0-9_-]{1,32}$' }
            space: { type: string, pattern: '^[a-z0-9_-]{1,32}$' }
        audio:
          type: [object, 'null']
          description: Null when the source has no sound.
          required: [bitrate_kbps]
          properties:
            bitrate_kbps: { type: integer, examples: [256] }
        check: { $ref: '#/components/schemas/CheckSettings' }
    RemuxParams:
      type: object
      title: remux
      description: |
        The source's streams in a new MP4, untouched (v0.2.8; the top rung when the source is
        already what that rung would be): `-i SRC -map 0:v:0 -map 0:a:0? -c copy [-tag:v hvc1]
        -movflags +faststart OUT`. `framemd5` compares the video and, when there is one, the
        first sound stream.
      properties:
        hvc1_tag: { type: boolean, default: false, description: For an HEVC source. }
        check: { $ref: '#/components/schemas/CheckSettings' }
    CheckParams:
      type: object
      title: check
      description: |
        Only the check (v0.2.8), for a file no worker encoded, such as a set imported from
        elsewhere or a re-check of a published file. The file is the job input `candidate`; the
        job's source is the reference for `compare` and `framemd5` (a decode-only check sends the
        candidate as the source). Nothing is downloaded: ffmpeg reads both over HTTP, with range
        requests, through a proxy the worker opens on 127.0.0.1 for this lease alone (the tunnel
        lives inside the worker). The result is `outcome: figures`.
      required: [check]
      properties:
        candidate: { type: string, default: candidate, description: The job input holding the file to check. }
        width: { type: integer, description: 'The candidate''s width, from the pipeline''s header check: `compare` scales the reference to it.' }
        height: { type: integer }
        audio: { type: boolean, default: true, description: 'Whether `framemd5` lists the sound too.' }
        check: { $ref: '#/components/schemas/CheckSettings' }
    CheckSettings:
      type: object
      description: |
        The check of the result, in the same lease after the encode and before the upload
        (v0.2.8). The worker measures and reports (`CheckFigures`); the pipeline compares the
        figures with its floors and accepts or rejects. Floors never reach a worker.
      properties:
        decode: { type: boolean, default: true, description: 'A full decode of the result: `-v error -xerror -i OUT -map 0 -f null -`. Lines of the null muxer about equal timestamps of variable-rate frames are not errors.' }
        frames: { type: boolean, default: true, description: The frames the result and the source decode to. }
        compare:
          type: [object, 'null']
          description: |
            The result against the source, scaled to the result's size, on every `every`th frame:
            `select='not(mod(n\,N))',setpts=N/TB,fps=1` on both sides, SSIM and PSNR-Y on the
            10-bit path, XPSNR in 8 bits, libvmaf with `vmaf.model` when asked. Two decoder
            threads per input and for the filter graph; libvmaf without a thread pool (4K peaks
            at about 0.7 GB without vmaf, 1.1 GB with).
          properties:
            every: { type: integer, minimum: 1, default: 5 }
            metrics: { type: array, items: { type: string, enum: [ssim, psnr_y, xpsnr] }, default: [ssim, psnr_y, xpsnr] }
            vmaf:
              type: [object, 'null']
              properties:
                model: { type: string, examples: [vmaf_v0.6.1, vmaf_4k_v0.6.1] }
        framemd5: { type: boolean, default: false, description: 'Every packet of the result against the source''s (stream, dts, pts, duration and size in seconds, md5, side data): for a remux.' }
    CheckFigures:
      type: object
      description: What the check found (v0.2.8). Absent figures were not asked for.
      properties:
        decode:
          type: object
          required: [errors]
          properties:
            errors: { type: integer }
            lines: { type: array, maxItems: 20, items: { type: string } }
        frames: { type: integer, description: Frames the result decodes to. }
        source_frames: { type: integer, description: 'Frames the source decodes to (an edit list may hide some from its header). Not for a rung with `fps` (v0.2.13): its file has the rate''s frames.' }
        duration_s: { type: number, description: The result's length as decoded. }
        compare:
          type: object
          properties:
            every: { type: integer }
            pairs: { type: integer, description: Frame pairs compared. }
            ssim: { type: [number, 'null'] }
            psnr_y: { type: [number, string, 'null'], description: 'dB, or "inf" for identical pictures.' }
            xpsnr: { type: [number, string, 'null'] }
            vmaf: { type: [number, 'null'] }
            vmaf_model: { type: [string, 'null'] }
        framemd5:
          type: object
          required: [match]
          properties:
            match: { type: boolean }
            packets: { type: integer }
            first_difference: { type: [string, 'null'], examples: ['packet 1204 of stream 0: size 18412 against 18410'] }
        audio_levels:
          type: object
          description: 'For `audio.mono` = `measure`.'
          properties:
            mid_db: { type: [number, string, 'null'], description: 'RMS level, or "-inf" for silence.' }
            side_db: { type: [number, string, 'null'] }
            mono: { type: boolean, description: Whether the worker downmixed. }
        check_s: { type: number, description: Seconds the check took. }
    WhisperParams:
      type: object
      title: whisper
      description: |
        whisper.cpp's `whisper-cli -m MODEL -l LANG -f WAV -t THREADS -bs 1 -bo 1 -ml 1 -sow -oj
        -of OUT -pp`, and `-ng` unless the worker's `gpu` limit is on (greedy, one segment per
        word, progress on stderr) with `OMP_WAIT_POLICY=passive`. A source
        that is not 16 kHz mono WAV is first turned into one with ffmpeg (`-map 0:a:0 -ac 1
        -ar 16000 -c:a pcm_s16le`). The result is the JSON file whisper-cli writes. In a lease,
        `model_sha256` is always the one model to run: for a job that lists `models`, the queue
        writes the one it chose for this worker there (v0.2.7).
      required: [language]
      properties:
        model_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        model: { type: string, examples: ['ggml-medium.bin'], description: For people; the worker finds the model by its sha256. }
        language: { type: string, examples: [de] }
        threads: { type: integer, minimum: 1, default: 4, description: At most the worker's `cpu_threads`. }
        models:
          type: array
          maxItems: 8
          items: { type: string, pattern: '^[0-9a-f]{64}$' }
          description: |
            A job's acceptable models, best first (v0.2.7), instead of one `model_sha256`. The
            queue gives the job to a worker holding the first it can: a worse model runs only
            when no connected, unpaused worker that may run the job holds a better one. Never in
            a lease.
    AlignParams:
      type: object
      title: align
      description: |
        Qwen3-ForcedAligner-0.6B (v0.2.16) times the words of a text that already exists in the
        source's sound: `align.py run`, which the worker embeds, under its engine's Python with
        `HF_HUB_OFFLINE=1`, after the sound is made 16 kHz mono WAV as for whisper. On a Mac MLX
        through `mlx-qwen3-asr`, bfloat16, MLX's buffer cache freed after each piece; on Linux
        PyTorch for the CPU through `qwen-asr`, float32 where 6 GiB are free beside what runs, else
        `lean` (bfloat16 weights, float32 products: 2.9 GB at its peak with the weights' pages,
        3.6 times float32's time). Progress on stderr as whisper-cli's `progress = N%`.

        **The words** (the input `text` names, UTF-8 JSON, at most 8 MiB and 100,000 words):
        `{"words": [{"text": "Ein", "start": 0.0, "end": 0.31}, …]}`, the text split on
        whitespace with its punctuation, in order, with the times it already has. They only cut
        the pieces: at most 30 s, between two words, at the widest gap once a piece holds 15 s,
        its sound to the middle of that gap. A file that is not this fails the attempt with
        `other` ("the aligner refused the words").

        **The result** is whisper-cli's `-oj` JSON with one segment per word of the file, in order,
        its `text` the word exactly after a space, `offsets` in milliseconds (steps of 80 ms), plus
        `engine` and `pieces`. A word the aligner gives no time (punctuation alone) sits without
        length where the word before it ends.
      required: [model_sha256, language]
      properties:
        model_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            The aligner's manifest: the sha256 of the lines `<sha256>  <name>\n` of its eight files
            at revision `c7cbfc20…`, sorted by name: `32f47d21e29b4029b9911c4ff8549e5187b099d52340f675f9717bde1f37ad4e`.
            A worker holds it as the folder `qwen3-forced-aligner-0.6b-c7cbfc20` in its models
            folder, fetched from huggingface.co at that revision, each file by its sha256, or put
            there by the host where the folder is read-only.
        model: { type: string, examples: [Qwen3-ForcedAligner-0.6B], description: For people. }
        language: { type: string, enum: [zh, en, yue, fr, de, it, pt, ru, es], description: "whisper's code; the aligner has no Japanese or Korean on a Mac." }
        text: { type: string, default: text, description: The input that holds the words. }
    FileRef:
      type: object
      required: [url, bytes, sha256]
      properties:
        url: { type: string, description: '`/jobs/{id}/source` or `/jobs/{id}/inputs/{name}`, relative to the API base.' }
        bytes: { type: integer }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    Source:
      allOf:
        - $ref: '#/components/schemas/FileRef'
        - type: object
          properties:
            container: { type: string, examples: [mp4, mov, wav] }
            duration_s: { type: number }
            frames: { type: integer }
            width: { type: integer }
            height: { type: integer }
    LeaseJob:
      type: object
      required: [job_id, kind, priority, source]
      description: The job as its worker needs it.
      properties:
        job_id: { $ref: '#/components/schemas/JobId' }
        upload_id: { type: string }
        title: { type: string, examples: ['#one 528: Die Vorschau'] }
        kind: { $ref: '#/components/schemas/JobKind' }
        priority: { $ref: '#/components/schemas/Priority' }
        source: { $ref: '#/components/schemas/Source' }
        inputs:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FileRef' }

    LeaseState:
      type: string
      enum: [active, delivered, given_back, expired, preempted, cancelled, failed]
    ReleaseReason:
      type: string
      enum: [paused, quit, disk_full, on_battery, user, too_slow, restart]
    LeaseRequest:
      type: object
      properties:
        kinds:
          type: array
          description: Narrow this claim to some of the accepted kinds.
          items: { $ref: '#/components/schemas/JobKind' }
        max_source_bytes: { type: integer }
        slot:
          type: string
          enum: [normal, high]
          default: normal
          description: |
            Which of the worker's slots claims (v0.2.14, 1.6.0). `normal` (one of its
            `max_parallel_jobs`) takes any job; `high` (one of its `high_priority_slots`) only jobs
            of priority `now` and `stage1`. Each kind counts only its own leases. A claim beside a
            lease in the other kind of slot, and a `high` one beside any lease, needs the RAM: the
            worker's memory less the last presence's `memory_used_bytes`, less the expected peak of
            each lease claimed since that presence (one the queue took back since included: its tool
            runs until the worker's next renewal), less 1 GB must hold the job's expected peak.
            Two normal claims side by side need none: `max_parallel_jobs` says the machine takes
            them. Where only the RAM keeps a `now` job out of a free high-priority slot and no worker
            has a slot for it, the queue takes that worker's lowest lease below `stage1` back
            (`410 preempted` at its next renewal), one at a time, and the worker's claims need the
            RAM until its next presences have measured it again (90 s).
        extra:
          type: boolean
          description: |
            `slot: high`, as a worker before 0.2.14 says it (its extra slot, v0.2.5). A worker of
            0.2.14 sends both, so that a queue before 0.2.14 reads the claim as its extra slot.
    Lease:
      type: object
      required: [lease_id, attempt, job, state, expires_at, renew_every_s, pause_give_back_s, params]
      properties:
        lease_id: { $ref: '#/components/schemas/LeaseId' }
        attempt: { type: integer, minimum: 1, description: "This lease's number among the job's attempts." }
        job: { $ref: '#/components/schemas/LeaseJob' }
        state: { $ref: '#/components/schemas/LeaseState' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        hold_until: { type: string, format: date-time, description: 'The latest a renewal reaches (1.4.0): then `410 overdue`.' }
        renew_every_s: { type: integer, examples: [30] }
        pause_give_back_s: { type: integer, examples: [60], description: How long a pause may hold this lease before the worker gives it back. }
        pause_hold: { type: boolean, description: 'A pause keeps this lease, suspended, until it ends (v0.2.18, 1.9.0): jobs of priority archive and stage 2, which nobody waits for. The worker does not give it back for the pause.' }
        paused_until: { type: [string, 'null'], format: date-time, description: "The worker's current pause." }
        params:
          oneOf:
            - $ref: '#/components/schemas/RungParams'
            - $ref: '#/components/schemas/WhisperParams'
            - $ref: '#/components/schemas/CutParams'
            - $ref: '#/components/schemas/RemuxParams'
            - $ref: '#/components/schemas/CheckParams'
            - $ref: '#/components/schemas/AlignParams'
          description: 'The params of the job''s kind: `RungParams` for `rung`, `WhisperParams` for `whisper`, `CutParams`, `RemuxParams`, `CheckParams`, `AlignParams` for `align`.'
        result:
          type: object
          properties:
            max_bytes: { type: integer }
            name: { type: string, examples: ['2160.mp4', 'whisper.json'], description: The file name the result should have. }
        progress: { oneOf: [{ $ref: '#/components/schemas/Progress' }, { type: 'null' }] }
        links:
          type: object
          properties:
            self: { type: string }
            source: { type: string }
            logs: { type: string }
            result: { type: string }
    Progress:
      type: object
      required: [phase]
      properties:
        phase: { type: string, enum: [downloading, encoding, checking, uploading, paused], description: "`checking` (v0.2.8): the check step after the encode; a worker may also go on saying `encoding`." }
        fraction: { type: number, minimum: 0, maximum: 1 }
        frames_done: { type: integer }
        frames_total: { type: integer }
        fps: { type: number, description: Frames per second over the last 10 s. }
        speed: { type: number, description: Times real time. }
        eta_s: { type: integer }
        bytes_done: { type: integer }
        bytes_total: { type: integer }
        out_time_s: { type: number, description: 'How far into the source the encode is, ffmpeg''s `out_time`.' }
        total_size_bytes: { type: integer, description: 'What the output holds so far, ffmpeg''s `total_size`.' }
        bitrate_kbps: { type: number, description: 'The output''s rate so far, ffmpeg''s `bitrate`.' }
        paused_since: { type: [string, 'null'], format: date-time }
    LogLineIn:
      type: object
      required: [time, level, message]
      properties:
        time: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warning, error] }
        source: { type: string, enum: [worker, ffmpeg, x265, x264, whisper, aligner] }
        message: { type: string, maxLength: 2000 }

    ResultIn:
      oneOf:
        - type: object
          title: A file
          required: [outcome, file, sha256, tools, encode_s]
          properties:
            outcome: { type: string, const: file }
            file: { type: string, description: 'The finished upload, `/files/{id}` or its id.' }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            frames: { type: integer }
            encode_s: { type: number }
            tools: { type: array, items: { $ref: '#/components/schemas/Tool' }, description: The tools that made it. }
            check: { $ref: '#/components/schemas/CheckFigures' }
        - type: object
          title: Figures
          description: The result of a `check` job (v0.2.8). No file.
          required: [outcome, check, tools]
          properties:
            outcome: { type: string, const: figures }
            check: { $ref: '#/components/schemas/CheckFigures' }
            tools: { type: array, items: { $ref: '#/components/schemas/Tool' } }
        - type: object
          title: A failure
          required: [outcome, code, message]
          properties:
            outcome: { type: string, const: failed }
            code:
              type: string
              enum: [source_checksum, decode_failed, encode_failed, tool_missing, model_missing, out_of_memory,
                     local_check_failed, check_failed, file_not_found, killed, other]
              description: |
                `check_failed` (v0.2.8): the check step could not run, for example ffmpeg exited
                non-zero while comparing. Figures below a floor are no failure: the worker reports
                them and the pipeline rejects.
                `killed`: the tool ended by a signal (the kernel's OOM killer sends SIGKILL). It and
                `out_of_memory` blame the machine, not the tools: the queue counts the failure but
                gives the job to the same worker again; only the second such failure of the job on
                one worker excludes it.
            message: { type: string, description: One line for a person. }
            signal: { type: string, description: 'For `killed`: the signal''s name.', examples: [SIGKILL] }
            exit_code: { type: integer, description: 'For `encode_failed`: the tool''s exit status.' }
            memory_available_bytes: { type: integer, description: 'For `killed`: the memory a new process could get right after, as the worker reads it.' }
      discriminator: { propertyName: outcome }
    Check:
      type: object
      required: [name, passed]
      properties:
        name: { type: string, examples: [decode, frames, length, codec, size, ssim, psnr_y, xpsnr] }
        passed: { type: boolean }
        value: { type: [number, string, 'null'] }
        floor: { type: [number, string, 'null'] }
    Result:
      type: object
      required: [lease_id, attempt, outcome, verdict]
      properties:
        lease_id: { $ref: '#/components/schemas/LeaseId' }
        attempt: { type: integer }
        outcome: { type: string, enum: [file, figures, failed] }
        verdict:
          type: string
          enum: [checking, accepted, rejected, superseded, failed]
          description: '`checking` until the pipeline decides; `superseded` when another attempt was accepted first; `failed` for a failure the worker reported.'
        reason: { type: [string, 'null'], description: 'Why it was rejected, one line.' }
        checks: { type: array, items: { $ref: '#/components/schemas/Check' } }
        decided_at: { type: [string, 'null'], format: date-time }
