openapi: 3.1.0
info:
  title: encode-queue pipeline and admin API
  version: 1.13.0
  license: { name: MIT, identifier: MIT }
  summary: How the pipeline submits and judges jobs, and how the upload center's Encoder page shows and steers the queue and its workers.
  description: |
    The queue server (`encode-queue`) serves this API on its own TCP listener (`EQ_API_LISTEN`),
    which on `encoder` sits on the queue's Docker network. It is never reachable through the
    WireGuard tunnel; workers use [helper.yaml](helper.yaml) there.

    **Two callers, two tokens** (bearer, each from a file the queue reads at start):

    - **The pipeline** (`iPhoneblog-web/video-pipeline`, token `EQ_PIPELINE_TOKEN_FILE`)
      submits jobs, watches them, fetches each result and **accepts or rejects it against
      ADR-0005's floors**. The queue never judges quality: it only moves files and states.
    - **The upload center's Encoder page** (token `EQ_ADMIN_TOKEN_FILE`) lists the queue and
      the workers, reorders and cancels jobs, pauses, adds and removes workers.

    Each operation names which token it takes; reads take either.

    **The life of a job**

    1. The pipeline puts the job (`PUT /jobs/{job_id}`): its kind, priority, parameters and its
       source, a file under the queue's source directory (`EQ_SOURCE_DIR`, a volume the
       pipeline and the queue share). The job is `queued`.
    2. A worker claims it (helper API): the job is `leased`, attempt 1. The worker fetches the
       source from the queue, encodes, reports progress, and uploads the result to the queue.
    3. The result arrives: the job is `checking`. The pipeline sees it in `GET /changes`,
       fetches the file (`GET /jobs/{id}/attempts/{n}/file`, or reads `path` under the result
       directory `EQ_RESULT_DIR` if it shares that volume), runs its checks and puts a verdict.
    4. **`accepted`**: the job is `done`; any other attempt still running is stopped
       (`410 job_done`), any other result waiting is `superseded`. **`rejected`**: the job goes
       back to `queued` and is never again offered to the worker that made it; after
       `max_failures` rejections and failures together it is `failed`. A failure with code
       `killed` or `out_of_memory` (the machine, not the tools) counts too, but excludes the
       worker only the second time on that job. When every worker able to run a job is
       excluded, the job says so in `waiting`, and after `EQ_EXCLUDE_BACKOFF_S` (600 s) since
       its last failure the reference worker (without one: every worker) gets it again.
    5. A lease that runs out, a worker that goes offline, a pause held past 60 s, a removed
       worker, a job of higher priority that needs the worker (`preempted`): the attempt ends
       and the job is `queued` again, the next attempt with the next number. A result that
       arrives late is still taken and judged; the first one accepted wins.
    6. The pipeline forgets a finished job (`DELETE /jobs/{job_id}`), which deletes its files
       on the queue. Finished jobs (`done`, `cancelled`, `failed`) it never forgets leave the
       state `EQ_JOB_RETENTION` after they finished (default 7 days), their result files and
       logs with them; the Encoder page can remove them sooner (`POST /jobs/cleanup`). Either
       way the pipeline sees them as forgotten in `/changes`, and the counts drop at once.

    **Priorities and order.** Every job has a priority, `now` (v0.2.5) and then ADR-0005's:
    `stage1`, then `stage2`, then `archive`, and a place within it. A worker that asks gets the
    first job in that order it may run and would finish about as soon as any other worker could
    (v0.2.7: its expected completion time at most 1.25 times the best, or the job waited longer
    than 30 s, 2 min, 15 min or 1 h by priority; the README's "Which worker gets a job"). The
    Encoder page moves a job (`POST /jobs/{id}/move`), and a job moved next
    to a job of another priority takes that priority. When a `stage1` or `stage2` job is queued
    and no free worker may run it, the queue preempts the active lease with the lowest priority
    whose worker may run it.

    **Moving a job to a worker.** The Encoder page can send a `queued` or `leased` job to one
    worker (`POST /jobs/{id}/assign`). A leased job is preempted on its old worker. The job is
    then pinned to the target: no other worker gets it, and the target takes it before its other
    queued jobs, until the target leases it. The pin shows in the job's `pinned_to`;
    `DELETE /jobs/{id}/assign` ends it ("Automatisch"). `GET /jobs/{id}/candidates` says, for
    every worker, whether it may take the job, when it is free and when the job would finish
    there: the move menu.

    **Estimates.** The queue estimates from what it measured, and says null when it has
    nothing to go on; a page shows an estimate as one (`≈`). A worker's speed on a rung class
    (codec, output size, preset) is the median fps of its last 5 accepted or delivered results
    on that class. A job's encode time on a worker is its frames divided by that worker's fps
    on the class, or, without one, by the reference worker's fps times the worker's
    `relative_speed`. Transfers, the pipeline's checks and preemption are not in the estimates.

    **Rules every call follows** are helper.yaml's: problem+json errors with a stable `code`,
    JSON Merge Patch, `Prefer: wait=N` long polls (at most 25 s), UTC times, sizes in bytes.

    **Not here.** `/metrics` (Prometheus, no token) and `/healthz` are outside `/v1`, on the
    queue's metrics listener (`EQ_METRICS_LISTEN`) when it has one, otherwise on this listener;
    the README lists the series.
servers:
  - url: '{base}'
    description: The queue's API listener on its Docker network.
    variables:
      base:
        default: http://encode-queue.invalid/v1
        description: The queue's container name or address and `EQ_API_LISTEN`'s port, plus `/v1`. Configuration, not part of the API.
tags:
  - name: Jobs
    description: Submitting, reading and steering jobs.
  - name: Results
    description: Fetching a result and putting the pipeline's verdict on it.
  - name: Workers
    description: The workers, `encoder`'s own included; adding one by its public key and removing it.
  - name: Queue
    description: The queue itself.
security:
  - pipeline: []
  - admin: []

paths:
  /status:
    get:
      tags: [Queue]
      operationId: getStatus
      summary: The queue itself
      description: Its version, counts, the reference tools the jobs default to, and the tunnel's public side.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: The queue, in order (the Encoder page's Warteschlange)
      description: |
        Jobs that are not finished come first, in the order the queue hands them out
        (`leased` and `checking` before `queued`, each by priority and place); finished jobs
        follow, newest first. `counts` covers every job, the archive included.
      parameters:
        - name: state
          in: query
          description: Only jobs in these states.
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/JobState' } }
        - name: priority
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/Priority' } }
        - name: kind
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/JobKind' } }
        - name: upload_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          description: '`next` from the previous page.'
          schema: { type: string }
      responses:
        '200':
          description: One page of the queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /jobs/cleanup:
    post:
      tags: [Jobs]
      operationId: cleanupJobs
      summary: Remove finished jobs now (admin)
      description: |
        Removes every job in one of `states` (only `done`, `cancelled` and `failed`; any other
        state answers `422 invalid`), optionally only those that finished at least
        `older_than_s` ago. Each goes as `DELETE /jobs/{id}` would: its result files and logs
        are deleted, and `/changes` reports it as forgotten. A job whose result the pipeline
        has not fetched yet is `checking`, never `done`, so it cannot be removed this way.
        `counts` in `GET /jobs` and `/status` reflect the removal in the same answer.
      security: [{ admin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cleanup' }
      responses:
        '200':
          description: What was removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    put:
      tags: [Jobs]
      operationId: submitJob
      summary: Submit a job (pipeline)
      description: |
        Idempotent: the pipeline chooses the id, so it can put a job again after a crash.
        The same job again answers `200` with the job as it is, also when it is `done` (a move
        on the Encoder page does not make it another job). A different job under an id that is
        not finished answers `409 job_exists`. A different job under a finished id, or the same
        job under a `failed` or `cancelled` id, replaces it and starts with attempt 1 again.

        The source must be a file under `EQ_SOURCE_DIR` with the given size; the queue checks
        the size, not the sha256 (the worker checks that). `requires` defaults to the reference
        tools for the kind (`GET /status`); the pipeline names them only to pin a job to other
        versions.
      security: [{ pipeline: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobSubmit' }
      responses:
        '200':
          description: This job was there already, unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '201':
          description: Queued.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    get:
      tags: [Jobs]
      operationId: getJob
      summary: One job, with every attempt so far
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Jobs]
      operationId: forgetJob
      summary: Forget a finished job and delete its files on the queue (pipeline)
      description: Only a `done`, `failed` or `cancelled` job; cancel an active one first. The pipeline calls this once it has taken the accepted file.
      security: [{ pipeline: [] }]
      responses:
        '204': { description: Forgotten. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{job_id}/move:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Jobs]
      operationId: moveJob
      summary: Reorder a queued job (the Encoder page's Prio)
      description: |
        Exactly one of `before`, `after` or `to`. A job moved next to a job of another priority
        takes that priority; `to: top` and `to: bottom` stay within the job's own priority
        unless `priority` names another. Only `queued` jobs move (`409 not_queued`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Move' }
      responses:
        '200':
          description: The job in its new place.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }

  /jobs/{job_id}/assign:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Jobs]
      operationId: assignJob
      summary: Send a job to one worker (the Encoder page's "Move to")
      description: |
        Takes either token, as `move` does. The job must be `queued` or `leased`
        (`409 not_movable`).

        - A **leased** job's active attempt on another worker ends as `preempted`: that worker
          gets `410 preempted` at its next call, and the attempt counts in its `preempted`. A job
          that the target holds already answers `200` unchanged.
        - The job is then **pinned** to the target (`pinned_to`). No other worker gets it, and
          the target takes it before its other queued jobs. A target that is busy takes it when
          it has a free slot. Nothing is preempted on the target.
        - The pin ends when the target leases the job, and also when the target is removed,
          goes offline or is paused, or when the job is cancelled. The job is then an ordinary
          queued job again.

        The target is refused with `409` when it is offline (`worker_offline`), paused
        (`worker_paused`), or may not run the job (`worker_mismatch`): its tools differ from
        the reference's for the job's kind, a model or font is missing, or its result for this
        job failed or was rejected already. The problem's `detail` says which. Every worker in
        `GET /workers` whose `state` is `idle` or `working` and whose `accepted_kinds` holds the
        job's kind is a target the page can offer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Assign' }
      responses:
        '200':
          description: The job, pinned to the target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }

    delete:
      tags: [Jobs]
      operationId: unassignJob
      summary: End a job's pin (the move menu's "Automatisch")
      description: The job is an ordinary job again; any worker may take it. A job without a pin answers `200` unchanged. An attempt already running stays where it is.
      responses:
        '200':
          description: The job, without a pin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{job_id}/candidates:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Jobs]
      operationId: jobCandidates
      summary: Every worker as a target for this job (the move menu)
      description: |
        One item per worker, by name. `available` is whether `POST /jobs/{id}/assign` would
        take it; when not, `reason_code` and `reason` always say why (the page greys the item and shows
        the reason). `current` marks the worker that runs the job now: its `finish_at` is the
        running attempt's. For every other worker the job starts over there ("Neu starten
        auf …" for a running job): `free_at` is when it has a free slot (now, or when its
        earliest attempt finishes encoding), and `finish_at` is `free_at` plus `encode_s`.
        Any of the three is null when the queue cannot estimate it.
      responses:
        '200':
          description: The candidates.
          content:
            application/json:
              schema:
                type: object
                required: [server_time, items]
                properties:
                  server_time: { type: string, format: date-time }
                  items: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{job_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: Cancel a job
      description: |
        The job is `cancelled`; a worker that holds it stops at its next progress report
        (`410 lease_cancelled`), and results still waiting are dropped. The pipeline learns it
        through `/changes`. A finished job answers `409 finished`.

        The body is optional: `by` (who cancelled, for example the Encoder page's signed-in
        user or `pipeline`) and `reason` (one line, for example `von Hand` or
        `neue Datei hochgeladen`). Both show in the job's `cancelled`. Without them, `by` is the
        caller's token (`admin` or `pipeline`) and `reason` is null.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                by: { type: string, maxLength: 64, examples: [thorsten] }
                reason: { type: string, maxLength: 200, examples: [von Hand, neue Datei hochgeladen] }
      responses:
        '200':
          description: The job, cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /jobs/{job_id}/retry:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Jobs]
      operationId: retryJob
      summary: Queue a failed or cancelled job again
      description: It keeps its attempts and their numbers; the count of failures starts again at 0 and every worker may take it again.
      responses:
        '200':
          description: The job, queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /changes:
    get:
      tags: [Jobs]
      operationId: listChanges
      summary: Every job that changed since a revision (long poll)
      description: |
        Every change to a job (state, attempt, progress, verdict, place) raises the queue's
        `revision`, and the job carries the revision of its last change. This answers the jobs
        whose revision is above `since`, oldest change first, each once in its current form,
        and waits up to `Prefer: wait` seconds when there is none. A forgotten job comes once as
        `{"job_id": ..., "forgotten": true}`. Start with `since=0`; keep the answer's
        `revision` for the next call. When `since` is above the queue's revision (its state was
        restored from an older copy), the answer has `reset: true` and every job.
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: Prefer
          in: header
          schema: { type: string, examples: ['wait=25'] }
      responses:
        '200':
          description: The changes; `items` is empty when the wait ran out.
          headers:
            Preference-Applied: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Changes' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /jobs/{job_id}/attempts/{attempt}/file:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Attempt'
    get:
      tags: [Results]
      operationId: getResultFile
      summary: The file an attempt delivered (pipeline)
      description: Resumes with `Range`. `ETag` is its sha256, which the queue checked on arrival. Gone once the attempt is rejected or superseded, or the job is forgotten.
      security: [{ pipeline: [] }]
      parameters:
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200':
          description: The whole file.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '206':
          description: The requested part.
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{job_id}/attempts/{attempt}/verdict:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/Attempt'
    put:
      tags: [Results]
      operationId: putVerdict
      summary: Accept or reject an attempt's result (pipeline)
      description: |
        Only for an attempt whose result is `checking`. **`accepted`** makes the job `done`
        with this attempt's file; every other waiting result becomes `superseded`, every other
        active lease ends (`410 job_done`). **`rejected`** deletes the file, counts against the
        worker (`encode_queue_worker_results_rejected_total`), and puts the job back to
        `queued` without that worker, or `failed` once it reached `max_failures`. A verdict on
        a job that is already `done` answers `409 job_done` and the attempt is `superseded`.
      security: [{ pipeline: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Verdict' }
      responses:
        '200':
          description: The job after the verdict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }

  /leases/{lease_id}/logs:
    parameters:
      - name: lease_id
        in: path
        required: true
        schema: { type: string, pattern: '^ls_[0-9A-Z]{26}$' }
    get:
      tags: [Jobs]
      operationId: listLeaseLogs
      summary: The log lines of one attempt
      description: The last 2,000 lines the worker sent, oldest first. Poll with `after` for new ones.
      parameters:
        - name: after
          in: query
          description: Only lines after this sequence number.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The lines.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LogLine' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers:
    get:
      tags: [Workers]
      operationId: listWorkers
      summary: Every worker (the Encoder page's Encoder table)
      responses:
        '200':
          description: The workers, `encoder`'s own included, by name.
          content:
            application/json:
              schema:
                type: object
                required: [items, server_time]
                properties:
                  server_time: { type: string, format: date-time }
                  items: { type: array, items: { $ref: '#/components/schemas/Worker' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Workers]
      operationId: addWorker
      summary: Add a worker by its public key (admin)
      description: |
        The Encoder page sends the name and the WireGuard public key it got from the worker,
        pasted or through the Safari extension (ADR-0007 §5). The queue gives the worker the
        next free address of its subnet and adds the peer to its own WireGuard at once; the peer
        list is the queue's state. The answer is the worker's tunnel configuration, as an object
        and as the one line the worker reads from a file or an environment variable. Nothing in
        it is secret; the private key never leaves the worker.
      security: [{ admin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerCreate' }
      responses:
        '201':
          description: Added.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrolment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /workers/{worker_id}:
    parameters:
      - name: worker_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkerId' }
    get:
      tags: [Workers]
      operationId: getWorker
      summary: One worker
      responses:
        '200':
          description: The worker.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workers]
      operationId: updateWorker
      summary: Rename or pause a worker (admin)
      description: A pause set here holds as one set from the worker's menu bar; the worker learns it with its next presence (at most 30 s).
      security: [{ admin: [] }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/WorkerPatch' }
      responses:
        '200':
          description: The worker.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worker' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Workers]
      operationId: removeWorker
      summary: Remove a worker and its peer (admin)
      description: Its key stops working at once; its active leases end (`cancelled`) and their jobs go back to the queue.
      security: [{ admin: [] }]
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workers/{worker_id}/tunnel:
    parameters:
      - name: worker_id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/WorkerId' }
    get:
      tags: [Workers]
      operationId: getWorkerTunnel
      summary: The worker's tunnel configuration again (admin)
      description: The same as the enrolment gave, for a worker whose configuration was lost.
      security: [{ admin: [] }]
      responses:
        '200':
          description: The configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrolment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    pipeline:
      type: http
      scheme: bearer
      description: The pipeline's token (`EQ_PIPELINE_TOKEN_FILE`).
    admin:
      type: http
      scheme: bearer
      description: The upload center's token (`EQ_ADMIN_TOKEN_FILE`). Workers never hold either.

  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/JobId' }
    Attempt:
      name: attempt
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Unauthorized:
      description: No token, or an unknown one (`unauthorized`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The other caller's operation (`forbidden`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such job, attempt, lease, file or worker (`not_found`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The state forbids this (`job_exists`, `not_queued`, `finished`, `not_finished`, `not_checking`, `job_done`, `key_exists`, `name_exists`, `subnet_full`, `not_movable`, `worker_offline`, `worker_paused`, `worker_mismatch`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Invalid:
      description: The body breaks the schema or a rule (`invalid`, `source_missing`, `source_size`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [unauthorized, forbidden, not_found, job_exists, not_queued, finished, not_finished, not_checking,
                 job_done, key_exists, name_exists, subnet_full, invalid, source_missing, source_size,
                 not_movable, worker_offline, worker_paused, worker_mismatch]

    JobId:
      type: string
      pattern: '^[a-z0-9][a-z0-9_-]{0,63}\.[a-z0-9-]{1,32}$'
      description: The upload's id and what the job makes; the pipeline chooses it.
      examples: ['one_528.2160-stage2', 'one_528.whisper']
    WorkerId:
      type: string
      pattern: '^wk_[a-z0-9]{8}$'
    JobKind:
      description: |
        helper.yaml's: `cut`, `remux` and `check` from v0.2.8. They, a rung's `check` step and
        `audio.mono: measure` go only to workers of 0.2.8 or later; an older worker does not
        offer the new kinds. `cut` matches on the reference's ffmpeg and libx264, `remux` and
        `check` on its ffmpeg.
      $ref: 'helper.yaml#/components/schemas/JobKind'
    JobState:
      type: string
      enum: [queued, leased, checking, done, failed, cancelled]
      description: |
        `queued` waits for a worker; `leased` has an active lease; `checking` has a result
        that waits for the pipeline's verdict (it may have an active lease as well, when the
        result came late); `done`, `failed` and `cancelled` are finished.
    Priority:
      type: string
      enum: [now, stage1, stage2, archive]
      description: |
        ADR-0005's order, stage 1 of a new upload first, and before it `now` (v0.2.5, the Encoder
        page's "Sofort"): a job someone in Funkhaus waits for, such as captions from the audio or
        a Loop. A `now` or `stage1` job may run in one of a worker's high-priority slots (v0.2.14,
        `Worker.slots`) beside other work, while the worker's free RAM holds the job's expected
        peak with 1 GB to spare. A `stage1` or `stage2` job no free worker may run preempts the
        lowest lower lease of a worker that may run it. A `now` job preempts only where the RAM is
        all that keeps it out of a free high-priority slot: that worker's lowest lease below
        `stage1`, one at a time.
    LeaseState:
      type: string
      enum: [active, delivered, given_back, expired, preempted, cancelled, failed]

    Tool:
      type: object
      required: [name, version]
      description: A tool and its exact version string; how each is read is in helper.yaml's `Tool`.
      properties:
        name: { type: string, enum: [ffmpeg, libx265, libx264, whisper.cpp, mlx-qwen3-asr, qwen-asr] }
        version: { type: string }
    Requires:
      type: object
      description: |
        What a worker must run to get the job. Tools match as text; models by sha256 (a whisper
        job's `model_sha256` is added on its own); fonts by family name (a rung's
        `captions.font` is added on its own).
      properties:
        tools: { type: array, items: { $ref: '#/components/schemas/Tool' } }
        models: { type: array, items: { type: string, pattern: '^[0-9a-f]{64}$' } }
        fonts: { type: array, items: { type: string } }

    RungParams:
      description: |
        helper.yaml's `RungParams`, unchanged; the worker builds its ffmpeg arguments from it. A rung
        with `fps`, `audio.sample_rate`, `audio.channels` or `edit_list: false` (v0.2.13, a clip)
        goes only to workers of 0.2.13 or later, since an older one would make the file without
        them. Until one is paired the job waits with `no_eligible_worker`, and its detail names the
        version and the workers that run older ones.
      $ref: 'helper.yaml#/components/schemas/RungParams'
    WhisperParams:
      description: helper.yaml's `WhisperParams`, unchanged.
      $ref: 'helper.yaml#/components/schemas/WhisperParams'
    AlignParams:
      description: |
        helper.yaml's `AlignParams`, unchanged (v0.2.16): the words are an input. Its source is the
        media or a WAV, as a whisper job's, with `duration_s` for the points. It goes to a worker of
        0.2.16 or later that holds the aligner and runs an engine (`mlx-qwen3-asr` or `qwen-asr`),
        and from a worker with `qwen-asr` (encoder's CPU) to a connected one with `mlx-qwen3-asr`
        (a Mac) that may run it, as a whisper job to a better model; a source that is not WAV also
        needs the reference's ffmpeg. Its expected peak is its engine's: 3.5 GiB on MLX, 3 GiB on
        the CPU. Points: its seconds of audio at the Mac Studio's MLX speed, 0.011 of real time
        (an hour: 0.66).
      $ref: 'helper.yaml#/components/schemas/AlignParams'
    CutParams:
      $ref: 'helper.yaml#/components/schemas/CutParams'
    RemuxParams:
      $ref: 'helper.yaml#/components/schemas/RemuxParams'
    CheckParams:
      description: helper.yaml's; the queue checks that `candidate` is among the job's inputs and that a `compare` names the candidate's width and height.
      $ref: 'helper.yaml#/components/schemas/CheckParams'
    CheckFigures:
      $ref: 'helper.yaml#/components/schemas/CheckFigures'

    FileIn:
      type: object
      required: [path, bytes, sha256]
      properties:
        path: { type: string, description: 'Relative to `EQ_SOURCE_DIR`; no `..`.', examples: ['one_528/master.mov'] }
        bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    SourceIn:
      allOf:
        - $ref: '#/components/schemas/FileIn'
        - type: object
          properties:
            container: { type: string, examples: [mov, mp4, wav] }
            duration_s: { type: number, description: For progress and time left. }
            frames: { type: integer, description: For progress. }
            width: { type: integer }
            height: { type: integer }
    JobSubmit:
      type: object
      required: [kind, priority, params, source, result]
      properties:
        kind: { $ref: '#/components/schemas/JobKind' }
        priority: { $ref: '#/components/schemas/Priority' }
        upload_id: { type: string, examples: [one_528] }
        title: { type: string, examples: ['#one 528: Die Vorschau'] }
        stage: { type: [integer, 'null'], enum: [1, 2, null], description: 'The ladder stage the job belongs to, for the Encoder page ("Stufe").' }
        params:
          oneOf:
            - $ref: '#/components/schemas/RungParams'
            - $ref: '#/components/schemas/WhisperParams'
            - $ref: '#/components/schemas/CutParams'
            - $ref: '#/components/schemas/RemuxParams'
            - $ref: '#/components/schemas/CheckParams'
            - $ref: '#/components/schemas/AlignParams'
          description: 'The params of its kind: `RungParams`, `WhisperParams`, `CutParams`, `RemuxParams`, `CheckParams` or `AlignParams`; unknown fields are refused.'
        source: { $ref: '#/components/schemas/SourceIn' }
        inputs:
          type: object
          description: More files the job needs, by name (for example `captions`).
          additionalProperties: { $ref: '#/components/schemas/FileIn' }
        result:
          type: object
          required: [name, max_bytes]
          properties:
            name: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$', examples: ['2160.mp4', 'whisper.json'] }
            max_bytes: { type: integer, minimum: 1, description: The most the result may be; the queue leases only while its disk has room for it. }
            expected_bytes: { type: integer, minimum: 0, description: 'What it is likely to weigh (v0.2.7), for the time to deliver it in the scoring; 0 if left out.' }
        requires: { $ref: '#/components/schemas/Requires' }
        max_failures: { type: integer, minimum: 1, description: 'Rejections and failures before the job is `failed`; the queue''s `EQ_MAX_FAILURES` (3) if left out.' }
        order:
          type: number
          description: |
            Its place within its priority: lower first, for example `h264.mp4` before the HEVC
            rungs. Without it the job goes after every job of its priority. The Encoder page's
            moves renumber the places.

    Progress:
      $ref: 'helper.yaml#/components/schemas/Progress'
    Check:
      $ref: 'helper.yaml#/components/schemas/Check'
    WorkerRef:
      type: object
      required: [worker_id, name]
      properties:
        worker_id: { $ref: '#/components/schemas/WorkerId' }
        name: { type: string }
    Attempt:
      type: object
      required: [attempt, lease_id, worker, state, started_at]
      properties:
        attempt: { type: integer, minimum: 1 }
        lease_id: { type: string }
        worker: { $ref: '#/components/schemas/WorkerRef' }
        state: { $ref: '#/components/schemas/LeaseState' }
        started_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time, description: While `active`. }
        ended_at: { type: [string, 'null'], format: date-time }
        end_code: { type: [string, 'null'], description: 'Why it ended without a result: the release reason, or `lease_expired`, `offline`, `preempted`, `assigned` (the Encoder page sent the job to another worker), `paused`, `worker_removed`, `job_cancelled`, `job_done`, `overdue` (held past its `hold_until`, 1.7.0).' }
        progress: { oneOf: [{ $ref: '#/components/schemas/Progress' }, { type: 'null' }] }
        model_sha256: { type: [string, 'null'], description: 'The whisper model this attempt ran (v0.2.7), the best of the job''s `models` its worker held.' }
        ect_s: { type: [number, 'null'], description: 'Its worker''s expected completion time at the claim, in seconds (v0.2.7; README, "Which worker gets a job").' }
        points: { type: number, minimum: 0, description: 'What it earned once accepted (v0.2.15, 1.11.0), by Punkte-Tabelle v1 (README, "Points"); 0 for an attempt not accepted, one whose result came after its lease ended, or a job the table does not price.' }
        scoring:
          type: [string, 'null']
          enum: [scored, waited, assigned, only_worker, not_claiming, speed_unknown, null]
          description: 'Why the claim had the comparison it had (1.8.0; README, "Which worker gets a job"); null for an attempt from before.'
        runner_up:
          type: [object, 'null']
          description: The best other worker's expected completion time at the claim; null when none could be estimated.
          properties:
            worker: { type: string }
            ect_s: { type: number }
            busy_s: { type: number, description: Until it has a free slot. }
            in_s: { type: number, description: The source over its measured download rate. }
            run_s: { type: number, description: 'The compute: the work over its measured or calibrated speed, scaled to its free threads and its learned correction.' }
            out_s: { type: number, description: The expected result over its upload rate. }
        result:
          type: [object, 'null']
          description: What it delivered.
          properties:
            outcome: { type: string, enum: [file, figures, failed], description: '`figures`: a `check` job''s result, the figures and no file (v0.2.8).' }
            verdict: { type: string, enum: [checking, accepted, rejected, superseded, failed], description: 'A result with figures waits as `checking` for the pipeline''s verdict like a file.' }
            sha256: { type: string }
            bytes: { type: integer }
            frames: { type: integer }
            encode_s: { type: number }
            tools: { type: array, items: { $ref: '#/components/schemas/Tool' } }
            path: { type: [string, 'null'], description: 'The file, relative to `EQ_RESULT_DIR`, while it exists.', examples: ['one_528.2160-stage2/1/2160.mp4'] }
            file_url: { type: [string, 'null'], description: '`/jobs/{id}/attempts/{n}/file`, while the file exists.' }
            failure_code: { type: [string, 'null'], description: 'helper.yaml''s failure codes, `killed` among them.' }
            message: { type: [string, 'null'], description: 'A failure''s line, or the reason of a rejection.' }
            signal: { type: [string, 'null'], description: 'The signal that ended the tool, for `killed`.', examples: [SIGKILL] }
            exit_code: { type: [integer, 'null'], description: 'The tool''s exit status, for `encode_failed`.' }
            memory_available_bytes: { type: [integer, 'null'], description: 'The worker''s available memory right after a `killed`.' }
            checks: { type: array, items: { $ref: '#/components/schemas/Check' } }
            check:
              description: What the worker's check found (v0.2.8), as it wrote it, at most 64 KiB; the pipeline compares the figures with its floors.
              oneOf: [{ $ref: '#/components/schemas/CheckFigures' }, { type: 'null' }]
            delivered_at: { type: string, format: date-time }
            decided_at: { type: [string, 'null'], format: date-time }
    Job:
      type: object
      required: [job_id, kind, priority, state, revision, attempts, queued_at]
      properties:
        job_id: { $ref: '#/components/schemas/JobId' }
        upload_id: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        kind: { $ref: '#/components/schemas/JobKind' }
        stage: { type: [integer, 'null'] }
        priority: { $ref: '#/components/schemas/Priority' }
        position: { type: [integer, 'null'], description: 'Its place among all `queued` jobs, 1 first; null otherwise.' }
        state: { $ref: '#/components/schemas/JobState' }
        rung: { type: [string, 'null'], description: 'The rung''s name, or null for whisper.' }
        resolution: { type: [string, 'null'], description: '"Auflösung": the output size, `WIDTHxHEIGHT`.', examples: ['3840x2160'] }
        quality: { type: [string, 'null'], description: '"Qualität": the preset and the CRF, the whisper model, or the aligner and the language.', examples: ['slower CRF 29', 'ggml-medium.bin', 'Qwen3-ForcedAligner-0.6B de'] }
        worker: { oneOf: [{ $ref: '#/components/schemas/WorkerRef' }, { type: 'null' }], description: '"Encoder": the worker of the active attempt, or of the accepted one.' }
        progress: { oneOf: [{ $ref: '#/components/schemas/Progress' }, { type: 'null' }], description: "The active attempt's last report: phase, share, fps, speed, time left." }
        params: { type: object, description: As submitted. }
        source: { $ref: '#/components/schemas/SourceIn' }
        inputs: { type: object, additionalProperties: { $ref: '#/components/schemas/FileIn' } }
        result_spec:
          type: object
          properties:
            name: { type: string }
            max_bytes: { type: integer }
        requires: { $ref: '#/components/schemas/Requires' }
        failures: { type: integer, description: Rejections and failures so far. }
        max_failures: { type: integer }
        excluded_workers: { type: array, items: { $ref: '#/components/schemas/WorkerRef' }, description: Workers whose result failed or was rejected; they get this job no more. }
        accepted_attempt: { type: [integer, 'null'] }
        attempts: { type: array, items: { $ref: '#/components/schemas/Attempt' }, description: Oldest first. }
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time, description: When the active or accepted attempt started. }
        finished_at: { type: [string, 'null'], format: date-time }
        elapsed_s: { type: [number, 'null'], description: '"Zeit": since `started_at`, or how long the accepted attempt took.' }
        eta_s:
          type: [integer, 'null']
          minimum: 0
          description: |
            Seconds until the active attempt finishes encoding: frames left divided by the
            current fps, rounded up. Frames left is `frames_total` less `frames_done` from the
            last progress report (`frames_total` falls back to the source's `frames`). Null
            until the attempt reports `encoding` with both numbers and an fps above 0, and for
            every job without an active attempt.
          examples: [1260]
        finish_at:
          type: [string, 'null']
          format: date-time
          description: |
            "Fertig". A finished job: `finished_at`. An active attempt: now plus `eta_s`. A queued
            job: the queue's forecast, which hands the queued jobs in order to the worker that
            would finish each first, each worker starting when its current attempts finish
            (see **Estimates**). Null when unknown, for example for whisper jobs and before
            any worker has a speed on the job's class.
        cancelled:
          type: [object, 'null']
          description: 'Who cancelled the job, why and when; null for a job never cancelled, and again after `retry`.'
          required: [by, reason, at]
          properties:
            by: { type: string, examples: [thorsten, admin, pipeline] }
            reason: { type: [string, 'null'], examples: [von Hand, neue Datei hochgeladen] }
            at: { type: string, format: date-time }
        waiting:
          oneOf: [{ $ref: '#/components/schemas/Waiting' }, { type: 'null' }]
          description: 'For a `queued` job that no worker could take now, why; null when one could and the job waits only for its turn or a free slot, and for every job not queued.'
        pinned_to:
          oneOf: [{ $ref: '#/components/schemas/Pin' }, { type: 'null' }]
          description: 'The worker the Encoder page sent the job to (`POST /jobs/{id}/assign`), until that worker leases it; null otherwise.'
        revision: { type: integer, description: "The queue's revision of this job's last change." }
    JobList:
      type: object
      required: [items, counts, server_time, revision]
      properties:
        server_time: { type: string, format: date-time }
        revision: { type: integer }
        counts:
          type: object
          description: Every job by state, and by priority for those not finished.
          properties:
            by_state: { type: object, additionalProperties: { type: integer }, examples: [{ queued: 412, leased: 3, checking: 1, done: 17 }] }
            by_priority: { type: object, additionalProperties: { type: integer }, examples: [{ stage1: 1, stage2: 2, archive: 413 }] }
        items: { type: array, items: { $ref: '#/components/schemas/Job' } }
        next: { type: [string, 'null'], description: Cursor for the next page. }
    Changes:
      type: object
      required: [revision, items]
      properties:
        revision: { type: integer, description: "Pass as `since` next time." }
        reset: { type: boolean, description: '`since` was above the queue''s revision; `items` holds every job.' }
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Job'
              - type: object
                required: [job_id, forgotten, revision]
                properties:
                  job_id: { $ref: '#/components/schemas/JobId' }
                  forgotten: { type: boolean, const: true }
                  revision: { type: integer }
    Move:
      type: object
      description: Exactly one of `before`, `after`, `to`.
      properties:
        before: { $ref: '#/components/schemas/JobId' }
        after: { $ref: '#/components/schemas/JobId' }
        to: { type: string, enum: [top, bottom] }
        priority: { $ref: '#/components/schemas/Priority' }
    Cleanup:
      type: object
      required: [states]
      properties:
        states:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [done, cancelled, failed] }
          examples: [[cancelled, failed]]
        older_than_s: { type: integer, minimum: 0, description: 'Only jobs that finished at least this long ago; 0 or left out: all of them.' }
    CleanupResult:
      type: object
      required: [removed, job_ids, revision]
      properties:
        removed: { type: integer, description: How many jobs went. }
        job_ids: { type: array, items: { $ref: '#/components/schemas/JobId' } }
        revision: { type: integer, description: "The queue's revision after the removal." }
    Assign:
      type: object
      required: [worker_id]
      properties:
        worker_id: { $ref: '#/components/schemas/WorkerId' }
    Waiting:
      type: object
      required: [code, detail, retry_at]
      properties:
        code:
          type: string
          enum: [no_eligible_worker, all_excluded, no_worker_available, no_room]
          description: |
            `no_eligible_worker`: no paired worker runs the tools, model and fonts it needs, or
            (v0.2.13) those that do are too old for it: the detail then says, e.g. "it waits for a
            worker of 0.2.13 or later, which sets fps, edit_list (paired: encoder 0.2.12)".
            `all_excluded`: every worker that does failed it or had its result rejected.
            `no_worker_available`: those that may run it are all offline or paused.
            `no_room` (v0.2.19): a worker could take it, but the queue's result directory has no
            room for its `max_bytes`: beside every running lease's `max_bytes` for a job below
            stage1; for one of priority now or stage1 beside the running high-priority leases'
            `max_bytes` and the lower ones' uploads in flight; `EQ_RESULT_RESERVE_BYTES` off both.
        detail: { type: string, description: One line for a person. }
        retry_at: { type: [string, 'null'], format: date-time, description: 'For `all_excluded`: when the reference worker gets the job again; null when none will (the reference is not among the excluded).' }
    Pin:
      type: object
      required: [worker_id, name, pinned_at]
      properties:
        worker_id: { $ref: '#/components/schemas/WorkerId' }
        name: { type: string }
        pinned_at: { type: string, format: date-time }
    Verdict:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string, enum: [accepted, rejected] }
        reason: { type: string, description: 'One line: the check that failed.', examples: ['ssim 0.931 below 0.95'] }
        checks: { type: array, items: { $ref: '#/components/schemas/Check' } }

    Limits:
      $ref: 'helper.yaml#/components/schemas/Limits'
    SlotCount:
      type: object
      required: [slots, busy]
      properties:
        slots: { type: integer, minimum: 0 }
        busy: { type: integer, minimum: 0 }
    WorkerCounts:
      $ref: 'helper.yaml#/components/schemas/WorkerCounts'
    Worker:
      type: object
      required: [worker_id, name, state, added_at]
      properties:
        worker_id: { $ref: '#/components/schemas/WorkerId' }
        name: { type: string, examples: [encoder, 'Mac Studio Thorsten'] }
        owner: { type: [string, 'null'] }
        state: { type: string, enum: [idle, working, paused, offline], description: '"Status".' }
        paused_until: { type: [string, 'null'], format: date-time }
        public_key: { type: string }
        tunnel_address: { type: string, examples: ['10.10.20.11'] }
        app_version: { type: [string, 'null'], description: "The worker's own version (encode-worker)." }
        host_app:
          type: [object, 'null']
          description: 'The app the worker runs inside, from its capabilities (helper.yaml''s `host_app`): "Slipstream" and its version. Null for a worker on its own, such as `encoder`''s container.'
          required: [name, version]
          properties:
            name: { type: string, examples: [Slipstream] }
            version: { type: string, examples: ['1.0.3'] }
        os: { type: [string, 'null'] }
        tools: { type: array, items: { $ref: '#/components/schemas/Tool' }, description: What it said it runs. }
        models: { type: array, items: { type: object, properties: { name: { type: string }, sha256: { type: string } } } }
        fonts: { type: array, items: { type: string } }
        hardware: { type: [object, 'null'] }
        limits: { $ref: '#/components/schemas/Limits' }
        slots:
          type: object
          required: [normal, high]
          description: |
            Its slots of each kind and how many hold a lease (v0.2.14, 1.10.0): `slots` is what the
            queue gives it (what it asked for in `limits`, capped by EQ_MAX_PARALLEL_JOBS and
            EQ_MAX_HIGH_PRIORITY_SLOTS), `busy` how many hold an active lease. Normal slots take
            every job, high-priority ones only `now` and `stage1`. A worker before 0.2.14 has one
            high-priority slot, its extra slot.
          properties:
            normal: { $ref: '#/components/schemas/SlotCount' }
            high: { $ref: '#/components/schemas/SlotCount' }
        points:
          type: object
          required: [table, today, week, total]
          description: |
            What its accepted results earned (v0.2.15, 1.11.0; README, "Points"), by
            Punkte-Tabelle v1: one point is one minute of the Mac Studio's work, the same job the
            same points on every machine. `today` and `week` (from Monday) follow Europe/Berlin.
            Points never steer which worker gets a job.
          properties:
            table: { type: string, examples: [v1] }
            today: { type: number, minimum: 0 }
            week: { type: number, minimum: 0 }
            total: { type: number, minimum: 0 }
        house: { type: boolean, description: 'It is encoder''s own worker (EQ_REFERENCE_WORKER), which counts with the others under a "Haus" badge (1.11.0).' }
        accepted_kinds: { type: array, items: { $ref: '#/components/schemas/JobKind' } }
        refused:
          type: array
          description: Kinds it may not take, and why (a tool version that differs from the reference).
          items:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/JobKind' }
              reason: { type: string }
        jobs:
          type: array
          description: '"Job" and "Tempo": its active attempts.'
          items:
            type: object
            required: [job_id, lease_id, attempt]
            properties:
              job_id: { $ref: '#/components/schemas/JobId' }
              title: { type: [string, 'null'] }
              rung: { type: [string, 'null'] }
              lease_id: { type: string }
              attempt: { type: integer }
              phase: { type: [string, 'null'] }
              fraction: { type: [number, 'null'] }
              fps: { type: [number, 'null'] }
              speed: { type: [number, 'null'] }
              eta_s: { type: [integer, 'null'] }
              slot: { type: string, enum: [normal, high], description: 'The slot it runs in (v0.2.14, 1.10.0): one of the normal ones or a high-priority one, beside them.' }
              extra: { type: boolean, description: 'True in a high-priority slot: `slot` is `high` (v0.2.5''s name, from its extra slot).' }
        last_seen: { type: [string, 'null'], format: date-time, description: '"Zuletzt".' }
        claiming: { type: boolean, description: 'It asked for work within two presence intervals or works on a lease (1.8.0).' }
        added_at: { type: string, format: date-time }
        counts: { $ref: '#/components/schemas/WorkerCounts' }
        endpoint:
          type: [string, 'null']
          description: |
            The worker's public address and UDP port as the queue's WireGuard sees it: where
            the last packet of the worker's peer came from, `IP:port` (IPv6 in brackets). Behind
            NAT this is the router's address. Null until a handshake.
          examples: ['203.0.113.7:51820', '[2001:db8::7]:61234']
        last_handshake: { type: [string, 'null'], format: date-time, description: 'The peer''s last WireGuard handshake; null before the first.' }
        tunnel_since:
          type: [string, 'null']
          format: date-time
          description: |
            When the tunnel last came up: the handshake that turned `tunnel_state` to `up` after
            it was `down` or before any. It stays while the tunnel stays up (the handshakes
            that renew it every 2 minutes do not move it), and is null while it is down. The
            queue looks at the tunnel every second; after the queue restarts, it is the first
            handshake since.
        tunnel_state:
          type: [string, 'null']
          enum: [up, down, null]
          description: '"Tunnel": `up` while the last handshake is at most 180 s old (WireGuard renews it every 120 s while packets flow), `down` after; null before the first.'
        system: { $ref: '#/components/schemas/WorkerSystem' }
        transfer:
          type: object
          required: [download, upload]
          description: |
            "Netz": how fast the worker moves files through the tunnel: source downloads
            (`GET /jobs/{id}/source` and inputs) and result uploads (tus `PATCH /files/{id}`).
          properties:
            download: { $ref: '#/components/schemas/TransferRate' }
            upload: { $ref: '#/components/schemas/TransferRate' }
        relative_speed:
          type: [number, 'null']
          description: |
            "Tempo": how fast the worker encodes against the reference worker
            (`EQ_REFERENCE_WORKER`, `encoder`); 1.0 is as fast, 1.8 is 1.8 times as fast. The
            median of the `relative_speed` of its `speed_classes` that have one. The reference
            worker itself is 1.0 once it has a class. Null while no class has both sides.
            Before any measured class, the median of the calibrated ones (v0.2.5): every worker
            encodes the same clip once per rung class at pairing and on a tools change.
        relative_speed_source:
          type: [string, 'null']
          enum: [measured, calibrated, null]
          description: Where `relative_speed` comes from; null without one.
        corrections:
          type: object
          additionalProperties: { type: number }
          description: 'Actual over estimated compute time by job kind, learned from its results (v0.2.7): an EWMA between 0.25 and 4; a kind it has no result of is left out (1).'
          examples: [{ rung: 1.12 }]
        speed_estimate:
          type: [object, 'null']
          description: |
            "Tempo" before a measured `relative_speed` exists (v0.2.5): the running job's live
            fps against the reference worker's median on the same rung class. An estimate, from
            one job's progress, and it moves with it. Set only while `relative_speed` is null, the
            worker encodes a rung job and reports fps, and the reference has a result on that
            class; null otherwise, and always for the reference worker.
          required: [value, class, fps, reference_fps]
          properties:
            value: { type: number, description: '`fps` / `reference_fps`.' }
            class: { type: string, description: 'The rung class, as in `speed_classes`: "libx265 3840x2160 slower".' }
            fps: { type: number, description: 'The running attempt''s last reported fps.' }
            reference_fps: { type: number }
          examples: [1.8]
        speed_classes:
          type: array
          description: Its speed per rung class, the most recently measured first; at most 16.
          items: { $ref: '#/components/schemas/SpeedClass' }
        free_at:
          type: [string, 'null']
          format: date-time
          description: 'When it has a free slot for a job: now when it has one, else when its earliest active attempt finishes encoding; null when that is unknown or the worker is offline or paused.'
    WorkerSystem:
      type: object
      description: |
        What the worker said about its machine in its capabilities (helper.yaml's `hardware`),
        and how many threads it lets the encoder use. Each field is null when the worker did not
        say (an older worker).
      properties:
        cpu_model: { type: [string, 'null'], examples: ['Apple M2 Max', 'AMD Ryzen 9 7950X 16-Core Processor'] }
        cpu_cores: { type: [integer, 'null'], description: Physical cores. }
        cpu_threads: { type: [integer, 'null'], description: Logical CPUs the worker can use. }
        threads_in_use: { type: [integer, 'null'], description: 'The encoder''s thread limit: `limits.cpu_threads`, or `cpu_threads` when there is no limit.' }
        other_load: { type: [number, 'null'], description: 'Threads other programs keep busy, from its last presence (v0.2.7).' }
        threads_busy: { type: [integer, 'null'], description: 'How many threads the worker''s own tools kept busy since its last presence, at most `cpu_threads` (v0.2.5); null when its last presence did not say.' }
        memory_bytes: { type: [integer, 'null'], description: RAM in all. }
        memory_used_bytes: { type: [integer, 'null'], description: 'RAM in use, from the worker''s last presence (in a container: the host''s).' }
        os_name: { type: [string, 'null'], examples: [macOS, 'Debian GNU/Linux'] }
        os_version: { type: [string, 'null'], examples: ['15.6', '13'] }
        arch: { type: [string, 'null'], examples: [arm64, amd64] }
        kernel: { type: [string, 'null'], description: 'In a container, the host''s kernel; `os_name` and `os_version` are the image''s.' }
    TransferRate:
      type: object
      required: [current_bps, samples]
      properties:
        current_bps:
          type: number
          description: |
            Now, bytes per second: while an attempt of the worker is in phase `downloading` or
            `uploading`, from its last two progress reports; else the latest sample if it ended
            in the last 60 s; else 0.
        last_bps: { type: [number, 'null'], description: 'The latest sample: one request that moved at least 1 MiB, its bytes over its time.' }
        avg_bps: { type: [number, 'null'], description: 'Moving average of the samples (exponential, weight 0.25 for the newest).' }
        last_at: { type: [string, 'null'], format: date-time, description: When the latest sample ended. }
        samples: { type: integer }
    SpeedClass:
      type: object
      required: [class, codec, width, height, preset, fps, samples, updated_at]
      properties:
        class: { type: string, description: 'Codec, output size and preset, one string.', examples: ['libx265 1920x1080 veryfast'] }
        codec: { type: string, examples: [libx265] }
        width: { type: integer }
        height: { type: integer }
        preset: { type: string }
        fps: { type: number, description: 'The median fps of its last results on this class, or its calibrated fps.' }
        samples: { type: integer, minimum: 0, maximum: 5, description: 'How many results the median is of; 0 for a calibrated class.' }
        reference_fps: { type: [number, 'null'], description: The reference worker's median on this class (its calibrated fps on the same clip for a calibrated one); null until it has one. }
        relative_speed: { type: [number, 'null'], description: '`fps` / `reference_fps`.' }
        updated_at: { type: string, format: date-time }
        source: { type: string, enum: [measured, calibrated], description: 'Delivered jobs, or the calibration clip (v0.2.5) for a class without them.' }
    Candidate:
      type: object
      required: [worker, state, available, current]
      properties:
        worker: { $ref: '#/components/schemas/WorkerRef' }
        state: { type: string, enum: [idle, working, paused, offline] }
        available: { type: boolean }
        reason_code:
          type: [string, 'null']
          enum: [not_movable, worker_offline, worker_paused, worker_mismatch, null]
          description: 'Set whenever `available` is false, and only then. `not_movable`: the job is not `queued` or `leased` (it is `checking` or finished), so no worker is a target; `worker_offline` also covers a worker paired but not yet connected.'
        reason: { type: [string, 'null'], examples: ['libx265 differs: worker 4.0, reference 4.3+1-e9b8812'] }
        current: { type: boolean, description: It runs the job now. }
        pinned: { type: boolean, description: The job is pinned to it. }
        claiming: { type: boolean, description: 'It asked for work within two presence intervals or works (1.8.0); one that does not counts in no scoring: "rechnet nicht".' }
        free_at: { type: [string, 'null'], format: date-time }
        relative_speed: { type: [number, 'null'], description: "Its relative speed on the job's class, or its overall one." }
        encode_s: { type: [number, 'null'], description: "The job's encode time there." }
        finish_at: { type: [string, 'null'], format: date-time }

    WorkerCreate:
      type: object
      required: [name, public_key]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        owner: { type: string }
        public_key: { type: string, description: 'The worker''s WireGuard public key, base64 (44 characters).' }
    WorkerPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        paused_until: { type: [string, 'null'], format: date-time }
    TunnelConfig:
      type: object
      required: [address, server_public_key, endpoint, allowed_ips, api]
      properties:
        address: { type: string, examples: ['10.10.20.11/32'], description: "The worker's tunnel address." }
        server_public_key: { type: string }
        endpoint: { type: string, description: 'Where the worker sends its UDP: the public host and port the queue was configured with (`EQ_WG_ENDPOINT`). A worker beside the queue may override it.', examples: ['vpn.example.org:51821'] }
        allowed_ips: { type: string, examples: ['10.10.20.1/32'] }
        persistent_keepalive_s: { type: integer, examples: [25] }
        api: { type: string, format: uri, description: 'The helper API''s base URL inside the tunnel., examples: [''http://10.10.20.1:8090/v1'']' }
    Enrolment:
      type: object
      required: [worker, tunnel, config_line]
      properties:
        worker: { $ref: '#/components/schemas/Worker' }
        tunnel: { $ref: '#/components/schemas/TunnelConfig' }
        config_line:
          type: string
          description: |
            The same as one line of text, which the worker reads from `EQ_TUNNEL` or the file
            `EQ_TUNNEL_FILE`: `eqtunnel1` and then `key=value` pairs separated by single spaces,
            in this order: `address`, `server_public_key`, `endpoint`, `allowed_ips`,
            `keepalive`, `api`. A value never holds a space; a reader splits each pair at its
            first `=`.
          examples: ['eqtunnel1 address=10.10.20.11/32 server_public_key=Zm9v...= endpoint=vpn.example.org:51821 allowed_ips=10.10.20.1/32 keepalive=25 api=http://10.10.20.1:8090/v1']

    Status:
      type: object
      required: [version, server_time, revision]
      properties:
        version: { type: string, examples: ['0.1.0'] }
        server_time: { type: string, format: date-time }
        revision: { type: integer }
        draining: { type: boolean }
        reference_worker: { type: [string, 'null'], description: 'The worker whose tools are the reference (`EQ_REFERENCE_WORKER`, `encoder`''s own).' }
        reference_tools:
          type: object
          description: The tools each kind requires by default, from the reference worker's last capabilities.
          additionalProperties: { type: array, items: { $ref: '#/components/schemas/Tool' } }
          examples: [{ rung: [{ name: ffmpeg, version: 7.1.2-0+deb13u1 }], whisper: [{ name: whisper.cpp, version: v1.9.5 }] }]
        tunnel:
          type: object
          properties:
            public_key: { type: string }
            endpoint: { type: string }
            address: { type: string }
            subnet: { type: string }
            peers: { type: integer }
        counts: { $ref: '#/components/schemas/JobList/properties/counts' }
        timings:
          type: object
          properties:
            lease_s: { type: integer, examples: [120] }
            renew_every_s: { type: integer, examples: [30] }
            long_poll_s: { type: integer, examples: [25] }
            presence_every_s: { type: integer, examples: [30] }
            pause_give_back_s: { type: integer, examples: [60] }
    LogLine:
      type: object
      required: [seq, time, level, message]
      properties:
        seq: { type: integer }
        time: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warning, error] }
        source: { type: string }
        message: { type: string }
